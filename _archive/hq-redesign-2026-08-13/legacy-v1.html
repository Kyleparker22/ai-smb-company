<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>yourco · HQ</title>
<style>
:root{
  --indigo:#EFE9DC;--indigo-deep:#0b0f1f;--cream:#0b0f1f;--cream-2:#1a2138;--parchment:#121a30;--card:rgba(22,28,52,.45);
  --brass:#C9A668;--brass-bright:#E2C690;--oxblood:#e06a78;--green:#7fc99a;--amber:#dcae62;
  --pewter:#8a8fa6;--ink-muted:rgba(238,233,220,.55);--hairline:rgba(184,150,90,.22);--hairline-2:rgba(184,150,90,.10);
  --shadow:0 10px 30px rgba(0,4,16,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--indigo);font-family:-apple-system,system-ui,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;padding-bottom:60px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.top{position:sticky;top:0;z-index:30;background:rgba(244,239,230,.82);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--hairline)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.mark{font-size:21px;font-weight:600;letter-spacing:-.015em}.mark .dot{color:var(--brass)}.mark .sub{color:var(--ink-muted);font-weight:500;font-size:15px;margin-left:8px}
.top .meta{font-size:12px;color:var(--ink-muted);display:flex;align-items:center;gap:8px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;box-shadow:0 0 0 0 rgba(79,107,74,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,107,74,.4)}70%{box-shadow:0 0 0 6px rgba(79,107,74,0)}100%{box-shadow:0 0 0 0 rgba(79,107,74,0)}}
.tabs{display:flex;align-items:center;gap:2px;margin:24px 0 20px;border-bottom:1px solid var(--hairline);flex-wrap:wrap}
.tab{appearance:none;background:none;border:none;font:inherit;cursor:pointer;color:var(--ink-muted);font-size:14.5px;font-weight:500;padding:10px 13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--indigo)}.tab.active{color:var(--indigo);border-bottom-color:var(--brass);font-weight:600}
.view.hidden{display:none}
h2.sec{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 14px}
.banner{background:var(--indigo);color:var(--cream);border-radius:12px;padding:18px 22px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.banner .st{font-size:17px;font-weight:600;letter-spacing:-.01em}
.banner .fw{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--brass-bright);flex-wrap:wrap}
.banner .fw span{opacity:.9}.banner .fw .arr{opacity:.5}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media(max-width:820px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric{background:var(--card);border:1px solid var(--hairline);border-radius:12px;padding:17px 19px;box-shadow:var(--shadow)}
.metric .k{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--brass)}
.metric .v{font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:5px}
.metric .s{font-size:12px;color:var(--ink-muted);margin-top:2px}
.focus{background:var(--card);border:1px solid var(--hairline);border-radius:12px;padding:18px 22px;box-shadow:var(--shadow)}
.focus li{list-style:none;padding:9px 0;border-top:1px solid var(--hairline-2);font-size:14px;display:flex;gap:10px}
.focus li:first-child{border-top:none}.focus li .n{color:var(--brass);font-weight:600}
.groups{display:flex;flex-direction:column;gap:22px}
.grp h3{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--brass);margin-bottom:11px}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.agrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.agrid{grid-template-columns:1fr}}
.org{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.org-the Founder{background:#161B33;color:#F4EFE6;border-radius:12px;padding:14px 30px;text-align:center;box-shadow:var(--shadow)}
.org-the Founder .nm{font-size:17px;font-weight:600}
.org-the Founder .rl{font-size:12px;color:rgba(244,239,230,.7);margin-top:3px}
.org-ceo{display:flex;justify-content:center;margin:10px 0 2px;position:relative}
.org-ceo::before{content:"";position:absolute;top:-10px;left:50%;width:1px;height:10px;background:var(--hairline)}
.org-ceo .ceo-card{max-width:248px;text-align:center;border-color:rgba(212,178,122,.4)}
.org-conduct{font-size:11.5px;color:var(--pewter);margin:9px 0 20px;letter-spacing:.02em}
.org-cols{display:flex;gap:14px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%}
.org-col{flex:1 1 0;min-width:158px;max-width:215px}
.org-col h4{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--brass);margin-bottom:11px;text-align:center;border-bottom:1px solid var(--hairline);padding-bottom:8px;display:flex;justify-content:center;gap:6px}
.org-col h4 span{color:var(--pewter);font-weight:600}
.org-col .agent{margin-bottom:10px}
.agent.sm{padding:11px 13px}.agent.sm .rl{font-size:11.5px}
.agent{background:var(--card);border:1px solid var(--hairline);border-radius:11px;padding:14px 15px;box-shadow:var(--shadow)}
.agent .nm{font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
.agent .rl{font-size:12.5px;color:var(--ink-muted);margin-top:2px}
.agent .cd{font-size:11.5px;color:var(--pewter);margin-top:9px}
.badge{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:9999px;white-space:nowrap}
.b-live{background:rgba(79,107,74,.15);color:var(--green)}
.b-built{background:rgba(184,150,90,.16);color:#8a6d3a}
.b-inbuild{background:rgba(154,123,58,.15);color:var(--amber)}
.b-scaffold{background:rgba(110,113,128,.14);color:var(--pewter)}
.b-planned{background:rgba(107,30,41,.1);color:var(--oxblood);border:1px dashed rgba(107,30,41,.4)}
.b-done{background:rgba(79,107,74,.15);color:var(--green)}
.b-open{background:rgba(107,30,41,.1);color:var(--oxblood)}
.b-pending{background:rgba(154,123,58,.15);color:var(--amber)}
.panel{background:var(--card);border:1px solid var(--hairline);border-radius:12px;box-shadow:var(--shadow);padding:20px 22px}
.bars{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.bar{display:grid;grid-template-columns:90px 1fr 30px;align-items:center;gap:12px;font-size:13px}
.bar .track{height:9px;background:var(--cream-2);border-radius:9999px;overflow:hidden}
.bar .fill{height:100%;background:var(--brass);border-radius:9999px}
.bar .n{text-align:right;font-weight:600;color:var(--brass)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--brass);padding:11px 16px;border-bottom:1px solid var(--hairline)}
td{padding:11px 16px;border-bottom:1px solid var(--hairline-2)}tr:last-child td{border-bottom:none}
.note{font-size:13px;color:var(--ink-muted);margin-top:12px}
footer{margin-top:46px;border-top:1px solid var(--hairline);padding-top:20px}
footer .wrap{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-muted)}
.lockup{display:flex;align-items:center;gap:10px}.lockup .dia{width:6px;height:6px;background:var(--brass);transform:rotate(45deg)}.lockup .rule{width:30px;height:1px;background:var(--brass)}.lockup .word{font-size:13px;font-weight:600;color:var(--indigo)}
a.link{color:var(--brass);font-weight:600;text-decoration:none}a.link:hover{text-decoration:underline}
/* ===== Melanie HUD — yourco dark mode ===== */
body{background:#0b0f1f;padding-bottom:60px}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(1100px 560px at 50% -8%,rgba(212,178,122,.13),transparent 70%),radial-gradient(720px 460px at 90% 102%,rgba(120,150,210,.06),transparent 70%),#0b0f1f}

.scan{position:fixed;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,rgba(212,178,122,.5),transparent);z-index:6;pointer-events:none;opacity:.3;animation:scan 7s linear infinite}

.jarvis{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--brass-bright);margin:22px 0 2px;letter-spacing:.01em;display:flex;align-items:center;gap:12px;flex-wrap:wrap;text-shadow:0 0 10px rgba(212,178,122,.2)}

.metric .s,.agent .rl,.note,td{color:var(--indigo)}
.banner{background:linear-gradient(135deg,rgba(20,28,54,.78),rgba(13,18,36,.72));border:1px solid var(--hairline);color:var(--indigo);box-shadow:inset 0 0 44px rgba(184,150,90,.07),0 0 24px rgba(0,4,16,.5)}
.banner .st{color:#f3ecd9;text-shadow:0 0 12px rgba(212,178,122,.3)}
.banner .fw span{color:var(--brass-bright)}.banner .fw .arr{color:var(--brass)}
.org-the Founder{background:radial-gradient(circle at 50% -10%,rgba(212,178,122,.32),rgba(18,24,46,.92));border:1px solid rgba(212,178,122,.55);box-shadow:0 0 34px rgba(212,178,122,.3),inset 0 0 26px rgba(212,178,122,.14);color:#f3ecd9}
.org-the Founder .nm{color:#f7efdc;text-shadow:0 0 16px rgba(212,178,122,.6)}

.bar .track{background:rgba(212,178,122,.12)}

th{border-bottom:1px solid var(--hairline)}td{border-bottom:1px solid var(--hairline-2)}
footer{border-top:1px solid var(--hairline)}

a.link{color:var(--brass-bright)}
.mel{position:fixed;right:20px;bottom:20px;width:340px;max-width:calc(100vw - 40px);z-index:40;background:rgba(13,18,36,.94);border:1px solid var(--hairline);border-radius:14px;box-shadow:0 0 30px rgba(212,178,122,.16),0 12px 44px rgba(0,4,16,.6);backdrop-filter:blur(12px);overflow:hidden}

.mel-h .x{margin-left:auto;cursor:pointer;color:var(--ink-muted);font-size:16px;line-height:1}

.mel-log .ma{font-size:13.5px;color:#f3ecd9;line-height:1.5;background:rgba(212,178,122,.09);border-left:2px solid var(--brass);padding:9px 12px;border-radius:7px}

.mel-row input::placeholder{color:var(--ink-muted)}.mel-row input:focus{border-color:var(--brass)}

/* Melanie's face — voice-reactive arc-reactor orb */
.orb{position:relative;width:20px;height:20px;flex:none;display:inline-block}
.orb::before,.orb::after{content:"";position:absolute;border-radius:50%;border:1.5px solid var(--brass)}
.orb::before{inset:0;opacity:.45}.orb::after{inset:4px;border-color:var(--brass-bright);opacity:.75}
.orb .core{position:absolute;inset:7px;border-radius:50%;background:var(--brass-bright);box-shadow:0 0 9px var(--brass-bright);animation:orbPulse 2.6s ease-in-out infinite}
@keyframes orbPulse{0%,100%{transform:scale(.82);opacity:.7}50%{transform:scale(1.06);opacity:1}}
.orb.speaking::before{animation:orbRing 1s ease-out infinite}
.orb.speaking::after{animation:orbRing 1s ease-out .35s infinite}
.orb.speaking .core{animation:orbCore .5s ease-in-out infinite}
@keyframes orbRing{0%{transform:scale(.65);opacity:.9}100%{transform:scale(1.55);opacity:0}}
@keyframes orbCore{0%,100%{transform:scale(.9)}50%{transform:scale(1.3)}}
/* live pulse ticker */
.ticker{overflow:hidden;height:30px;display:flex;align-items:center;white-space:nowrap;border-top:1px solid var(--hairline-2);border-bottom:1px solid var(--hairline-2);background:rgba(22,28,52,.32);-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.ticker-track{display:inline-flex;gap:34px;animation:ticker 46s linear infinite;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;letter-spacing:.04em;color:var(--ink-muted)}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-item{display:inline-flex;align-items:center;gap:7px}
.ticker-item .pip{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);flex:none}
.ticker-item .pip.brass{background:var(--brass);box-shadow:0 0 6px var(--brass)}
.ticker-item b{color:var(--brass-bright);font-weight:600}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.nk-list li{list-style:none;padding:8px 0;border-top:1px solid var(--hairline-2);font-size:13.5px;display:flex;gap:10px;align-items:baseline}
.nk-list li:first-child{border-top:none}
.nk-age{color:var(--brass-bright);font-weight:600;font-family:ui-monospace,Menlo,monospace;font-size:12px;flex:none;min-width:34px}
.panel.nag{border-color:rgba(224,106,120,.55);box-shadow:0 0 22px rgba(224,106,120,.14),inset 0 0 34px rgba(224,106,120,.05)}
.panel.nag h2.sec{color:var(--oxblood);text-shadow:0 0 8px rgba(224,106,120,.3)}
.nag-line{font-size:19px;font-weight:600;color:#f3d1d6;letter-spacing:-.01em;line-height:1.35}
/* ===== Reports tab — loop artifacts, readable ===== */
.rep-layout{display:grid;grid-template-columns:264px minmax(0,1fr);gap:16px;align-items:start;margin-top:18px}
@media(max-width:860px){.rep-layout{grid-template-columns:1fr}}
.rep-rail{padding:10px 0 12px}
.rep-rail h4{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);text-shadow:0 0 8px rgba(212,178,122,.2);padding:12px 18px 6px}
.rep-src{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;appearance:none;background:none;border:none;font:inherit;text-align:left;cursor:pointer;padding:7px 18px;font-size:13px;color:var(--indigo)}
.rep-src:hover{background:rgba(212,178,122,.07)}
.rep-src.active{background:rgba(212,178,122,.12);color:var(--brass-bright);box-shadow:inset 2px 0 0 var(--brass)}
.rep-src .d{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--ink-muted);flex:none}
.rep-src.never,.rep-src.never .d{color:var(--pewter);opacity:.85}
.rep-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rep-head .t{font-size:16px;font-weight:600;color:#f3ecd9;text-shadow:0 0 12px rgba(212,178,122,.25)}
.rep-head select{appearance:none;background:rgba(255,255,255,.04);border:1px solid var(--hairline);border-radius:8px;color:var(--brass-bright);font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:4px 12px;cursor:pointer;outline:none}
.rep-head select:hover,.rep-head select:focus{border-color:var(--brass)}
.rep-body{background:rgba(32,40,72,.5);border:1px solid var(--hairline-2);border-radius:10px;padding:20px 24px;font-size:13.5px;line-height:1.65;color:#e7e1d2;overflow-wrap:break-word}
.rep-body h1,.rep-body h2,.rep-body h3{color:var(--brass-bright);letter-spacing:-.01em;margin:18px 0 8px;line-height:1.3;font-weight:600}
.rep-body h1{font-size:18px}.rep-body h2{font-size:16px}.rep-body h3{font-size:14px}
.rep-body h4,.rep-body h5,.rep-body h6{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--brass);margin:16px 0 6px}
.rep-body>:first-child{margin-top:0}
.rep-body p{margin:6px 0}
.rep-body ul,.rep-body ol{margin:6px 0;padding-left:24px}
.rep-body li{margin:3px 0}
.rep-body code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:rgba(212,178,122,.1);border:1px solid var(--hairline-2);border-radius:5px;padding:1px 5px;color:#e9d9b4}
.rep-body pre{font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.55;background:rgba(11,15,31,.65);border:1px solid var(--hairline-2);border-radius:8px;padding:12px 14px;margin:10px 0;overflow-x:auto;white-space:pre}
.rep-body blockquote{border-left:2px solid var(--brass);background:rgba(212,178,122,.06);margin:10px 0;padding:8px 14px;border-radius:0 8px 8px 0;color:var(--ink-muted)}
.rep-body hr{border:none;border-top:1px solid var(--hairline);margin:14px 0}
.rep-body .md-tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--hairline-2);border-radius:8px}
.rep-body table{font-size:12.5px}
.rep-body th{white-space:nowrap}
.metric.rep-tile{cursor:pointer}
.metric .s.mut2{color:var(--pewter)}
/* ===== To Do panel (Overview) ===== */
.todo-list{margin-top:4px}
.todo-it{list-style:none;display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--hairline-2);font-size:13.5px}
.todo-it:first-child{border-top:none}
.todo-it input[type=checkbox]{accent-color:var(--brass);cursor:pointer;transform:translateY(1px)}
.todo-it.done .tx{text-decoration:line-through;color:var(--pewter)}
.todo-it .del{margin-left:auto;cursor:pointer;color:var(--ink-muted);font-size:12px;padding:0 4px;flex:none}
.todo-it .del:hover{color:var(--oxblood)}
.todo-row{display:flex;gap:8px;margin-top:12px}
.todo-row input{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid var(--hairline);border-radius:9px;padding:8px 11px;color:#f3ecd9;font:inherit;font-size:13px;outline:none}
.todo-row input::placeholder{color:var(--ink-muted)}.todo-row input:focus{border-color:var(--brass)}
.todo-row button{appearance:none;border:1px solid var(--hairline);background:rgba(212,178,122,.1);color:var(--brass-bright);border-radius:9px;padding:0 15px;cursor:pointer;font:inherit;font-size:13px}
.todo-row button:hover{border-color:var(--brass);box-shadow:0 0 12px rgba(212,178,122,.25)}
/* ---- goals band + tab ---- */
.goalband{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin:10px 0 4px;padding:9px 16px;border:1px solid var(--hairline);border-radius:12px;background:rgba(255,255,255,.02);cursor:pointer;font-size:12px}
.goalband:empty{display:none}
.goalband .gseg{display:flex;align-items:center;gap:7px;white-space:nowrap}
.goalband .gseg .gl{color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em;font-size:10.5px}
.goalband .gseg .gv{font-weight:600}
.goalband .gbar{width:44px;height:4px;border-radius:2px;background:rgba(255,255,255,.09);overflow:hidden}
.goalband .gbar i{display:block;height:100%;background:var(--brass)}
.goalband .gset{color:var(--brass);font-weight:600}
.goal-panels{display:grid;grid-template-columns:1fr;gap:16px}
.goal-panel .ghead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.goal-panel .ghead .gt{font-weight:700;letter-spacing:.02em}
.goal-panel .ghead .gel{font-size:11.5px;color:var(--ink-muted)}
.grow{display:grid;grid-template-columns:170px 90px 110px 1fr 170px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--hairline)}
.grow:first-of-type{border-top:none}
.grow .gm{font-size:12.5px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.grow .gc{font-weight:700;font-size:15px}
.grow .gtv{font-size:13px;color:var(--ink-muted);cursor:pointer;border-bottom:1px dashed transparent}
.grow .gtv:hover{border-bottom-color:var(--brass);color:var(--brass)}
.grow .gtv .pen{margin-left:6px;font-size:11px;opacity:.45}
.grow .gtv:hover .pen{opacity:1;color:var(--brass)}
.grow .gtv input{width:90px;background:transparent;border:1px solid var(--brass);border-radius:6px;color:inherit;font:inherit;padding:2px 6px}
.grow .gpb{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.grow .gpb i{display:block;height:100%;background:var(--brass);transition:width .4s}
.grow .gpb.unset i{background:rgba(255,255,255,.14)}
.grow .gpace{font-size:11.5px;color:var(--ink-muted);text-align:right}
.grow .gpace.ahead{color:#7fbf9a}
.grow .gpace.behind{color:#c98a6b}
.gsrc{font-size:10.5px;color:var(--ink-muted);opacity:.7;grid-column:1/-1;margin-top:-4px;padding-bottom:4px}
@media(max-width:820px){.grow{grid-template-columns:1fr 70px 80px;row-gap:4px}.grow .gpb,.grow .gpace{grid-column:1/-1}}
</style>
</head>
<body>
  <div class="scan"></div>
  <header class="top"><div class="wrap">
    <div class="mark">yourco<span class="dot">.</span><span class="sub">// MELANIE · HQ</span></div>
    <div class="meta"><span class="live-dot"></span>online<span class="meta-upd"> · updated <span id="gen">—</span></span></div>
  </div></header>
  <div class="ticker"><div class="ticker-track" id="ticker-track"></div></div>
  <div class="wrap"><div class="jarvis" id="jarvis"></div></div>

  <div class="wrap">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-v="overview">Overview</button>
      <button class="tab" data-v="goals">Goals</button>
      <button class="tab" data-v="agents">Agents</button>
      <button class="tab" data-v="pipeline">Pipeline</button>
      <button class="tab" data-v="finance">Finance</button>
      <button class="tab" data-v="delivery">Delivery</button>
      <button class="tab" data-v="scale">Scale</button>
      <button class="tab" data-v="compliance">Compliance</button>
      <button class="tab" data-v="loops">Loops</button>
      <button class="tab" data-v="reports">Reports</button>
      <button class="tab" data-v="trust">Trust</button>
    </nav>
    <div class="goalband" id="goalband"></div>
    <section class="view" id="v-overview"></section>
    <section class="view hidden" id="v-goals"></section>
    <section class="view hidden" id="v-agents"></section>
    <section class="view hidden" id="v-pipeline"></section>
    <section class="view hidden" id="v-finance"></section>
    <section class="view hidden" id="v-delivery"></section>
    <section class="view hidden" id="v-scale"></section>
    <section class="view hidden" id="v-compliance"></section>
    <section class="view hidden" id="v-loops"></section>
    <section class="view hidden" id="v-reports"></section>
    <section class="view hidden" id="v-trust"></section>
  </div>

  <div class="mel" id="mel">
    <div class="mel-h"><span class="orb" id="mel-orb"><span class="core"></span></span>MELANIE<span class="x" id="mel-x" title="hide">–</span></div>
    <div class="mel-log" id="mel-log"><div class="ma">Ask me anything, sugar — the leads, the pipeline, the team, or what's on this week.</div></div>
    <div class="mel-row"><input id="mel-input" placeholder="Ask Melanie…" autocomplete="off" /><button class="mel-mic" id="mel-mic" title="speak">&#127908;</button><button class="mel-send" id="mel-send" title="send">&#9654;</button></div>
  </div>

  <footer><div class="wrap">
    <div class="lockup"><span class="dia"></span><span class="rule"></span><span class="word">yourco</span><span class="rule"></span><span class="dia"></span></div>
    <div>Atlas aggregates this live · we learn your business. AI does the work.</div>
  </div></footer>

<script>
const $ = s => document.querySelector(s);
let P = null, D = null;
const badge = s => ({live:"b-live",built:"b-built","in-build":"b-inbuild","in-training":"b-inbuild",scaffold:"b-scaffold",planned:"b-planned"}[s]||"b-scaffold");
const money = n => (n==null)?"—":"$"+Number(n).toLocaleString();

async function load(){
  try{ const r=await fetch("/api/dashboard",{cache:"no-store"}); P=await r.json(); }
  catch(e){ $("#v-overview").innerHTML="<div class='panel'>Run <code>python3 dashboard/server.py</code> and open http://127.0.0.1:8791</div>"; return; }
  $("#gen").textContent = P.generatedAt || "—";
  render();
}

function render(){
  D=P.dashboard; D.pipeline=P.pipeline||{}; D.tasks=P.tasks||[]; const pipe=D.pipeline;
  const DV=P.derived||D.derived||{};  // repo-derived truth (refresh.py); falls back to committed data.json copy
  renderTicker();
  const agents=D.agents||[];
  const live=agents.filter(a=>a.status==="live").length;
  const loopsArr=D.loops||[], loopsArmed=loopsArr.filter(l=>l.status==="armed").length;  // single source of truth (matches Loops + Trust tabs)
  // Overview
  const fw = (D.flywheel?.stages||[]).map(s=>`<span>${s}</span>`).join('<span class="arr">→</span>');
  const cards = [
    ["Clients", D.company.metrics.clients ?? "—", "live engagements"],
    ["MRR", money(D.company.metrics.mrr), "recurring"],
    ["Pipeline", pipe.value!=null?money(pipe.value):"—", (pipe.openDeals||0)+" in motion · "+(pipe.prospects||0)+" prospects"],
    ["Agents", live+" / "+agents.length, "live / total"],
    ["Loops on time", DV.loopSummary?DV.loopSummary.onTime+" / "+DV.loopSummary.tracked:loopsArmed, DV.loopSummary?((DV.loopSummary.stale+DV.loopSummary.neverRan)?(DV.loopSummary.stale+" stale · "+DV.loopSummary.neverRan+" never ran"):"all healthy · "+DV.loopSummary.built+" built"):"of "+loopsArr.length+" built"],
    ["Runway", D.company.metrics.runwayMonths!=null?D.company.metrics.runwayMonths+" mo":"—", "set cash to compute"],
    ["Cash", money(D.company.metrics.cash), "on hand"],
    ["Flywheel", D.flywheel.state, "growth loop"]
  ];
  // Watchdog chips + Needs the Founder + runway — all derived live from the repo (refresh.py)
  const wd=DV.watchdogs||{}, nk=DV.needsFounder, rw=DV.runway;
  const chip=(label,w)=>{
    if(!w||w.status==="missing"||w.status==="unknown") return `<span class="chip na"><span class="dot"></span>${label} · no report</span>`;
    return w.status==="clean"
      ? `<span class="chip ok"><span class="dot"></span>${label} · clean · ${esc(w.date||"")}</span>`
      : `<span class="chip bad"><span class="dot"></span>${label} · drift ×${w.count||"?"} · ${esc(w.date||"")}</span>`;
  };
  const chipsHtml=`<div class="chips">${chip("Consistency",wd.consistency)}${chip("Governance",wd.governance)}</div>`;
  const nkHtml = nk
    ? `<div class="panel"><h2 class="sec">Needs the Founder <span class="badge ${nk.total?"b-open":"b-done"}" style="margin-left:8px">${nk.total}</span></h2>
       <ul class="nk-list">${(nk.items||[]).slice(0,6).map(i=>`<li><span>${i.sev||"·"}</span><span class="nk-age">${esc(i.age||"")}</span><span>${esc(i.name)}</span></li>`).join("")||"<li>queue is clear</li>"}</ul>
       <div class="note">${esc(nk.source||"via Jim's open-loops chaser")} · ${esc(nk.date||"—")}${nk.seedCount?` · +${nk.seedCount} seed item${nk.seedCount===1?"":"s"} (loops/open-loops/)`:""}</div></div>`
    : `<div class="panel"><h2 class="sec">Needs the Founder</h2><div class="note">no queue artifact yet — Jim's open-loops chaser hasn't written to <code>loops/open-loops/</code></div></div>`;
  let rwHtml="";
  if(rw&&rw.cashTBD){
    rwHtml=`<div class="panel nag"><h2 class="sec">Runway</h2>
      <div class="nag-line">cash on hand TBD — ${rw.daysSinceAsOf!=null?rw.daysSinceAsOf:"?"} days since ${esc(rw.asOf||"—")}</div>
      <div class="note">MRR ${esc(rw.mrr||"—")} · burn ${esc(rw.burn||"—")} · set cash in <code>finance/runway.md</code> — 10 minutes</div></div>`;
  } else if(rw){
    rwHtml=`<div class="panel"><h2 class="sec">Runway</h2>
      <div class="trust-stats" style="margin-top:6px">
        <div><span class="ts-n">${esc(rw.cash||"—")}</span><span class="ts-l">cash on hand</span></div>
        <div><span class="ts-n">${esc(rw.mrr||"—")}</span><span class="ts-l">MRR</span></div>
        <div><span class="ts-n">${rw.runwayMonths!=null?rw.runwayMonths+" mo":"—"}</span><span class="ts-l">runway</span></div>
      </div>
      <div class="note">from <code>finance/runway.md</code> · as of ${esc(rw.asOf||"—")}</div></div>`;
  }
  $("#v-overview").innerHTML = `
    <div class="banner"><div class="st">${D.company.stage}</div><div class="fw">${fw}</div></div>
    ${chipsHtml}
    <div class="metrics">${cards.map(c=>`<div class="metric"><div class="k">${c[0]}</div><div class="v">${c[1]}</div><div class="s">${c[2]}</div></div>`).join("")}</div>
    <div class="ov2">${nkHtml}${rwHtml}<div id="todo-wrap"></div></div>
    <h2 class="sec">This week's focus</h2>
    <ul class="focus">${D.company.focus.map((f,i)=>`<li><span class="n">${i+1}</span><span>${esc(f)}</span></li>`).join("")}</ul>`;

  // Agents — org chart (the Founder conducts; CEO layer under him; functional branches)
  const GORDER=["Ops","Sales","Marketing","Delivery","Finance","People & Desk"];
  const ceoA=agents.filter(a=>a.group==="CEO");          // CEO sits under the Founder, not in a column
  const colA=agents.filter(a=>a.group!=="CEO");
  const gset=[...new Set(colA.map(a=>a.group))];
  const ordered=GORDER.filter(g=>gset.includes(g)).concat(gset.filter(g=>!GORDER.includes(g)));
  $("#v-agents").innerHTML = `<div class="org">
    <div class="org-the Founder"><div class="nm">the Founder</div><div class="rl">Founder · conducts the agents</div></div>
    ${ceoA.map(a=>`<div class="org-ceo"><div class="agent ceo-card"><div class="nm">${esc(a.name)}<span class="badge ${badge(a.status)}">${esc(a.status)}</span></div>
      <div class="rl">${esc(a.role)}</div></div></div>`).join("")}
    <div class="org-conduct">conducts ↓ · ${agents.length} AI employees · ${live} live</div>
    <div class="org-cols">${ordered.map(g=>`
      <div class="org-col"><h4>${g}<span>${colA.filter(a=>a.group===g).length}</span></h4>
      ${colA.filter(a=>a.group===g).map(a=>`
        <div class="agent sm"><div class="nm">${esc(a.name)}<span class="badge ${badge(a.status)}">${esc(a.status)}</span></div>
        <div class="rl">${esc(a.role)}</div></div>`).join("")}</div>`).join("")}</div>
  </div>`;

  // Pipeline
  const maxN = Math.max(1,...(pipe.byStage||[]).map(s=>s.n));
  $("#v-pipeline").innerHTML = `
    <div class="metrics"><div class="metric"><div class="k">Open deals</div><div class="v">${pipe.openDeals??"—"}</div><div class="s">in pipeline</div></div>
    <div class="metric"><div class="k">Value</div><div class="v">${pipe.value!=null?money(pipe.value):"—"}</div><div class="s">annualized</div></div>
    <div class="metric"><div class="k">Companies</div><div class="v">${pipe.companies??"—"}</div><div class="s">accounts</div></div>
    <div class="metric"><div class="k">Contacts</div><div class="v">${pipe.contacts??"—"}</div><div class="s">people</div></div></div>
    <div class="panel"><h2 class="sec">Deals by stage</h2><div class="bars">${(pipe.byStage||[]).map(s=>`
      <div class="bar"><span>${esc(s.label)}</span><span class="track"><span class="fill" style="width:${Math.round(s.n/maxN*100)}%"></span></span><span class="n">${s.n}</span></div>`).join("")}</div>
      <div class="note">Live from the CRM. Full board + editing → <a class="link" href="http://127.0.0.1:8790" target="_blank">open the CRM (David)</a></div></div>`;

  // Finance
  $("#v-finance").innerHTML = `
    <div class="metrics"><div class="metric"><div class="k">Cash</div><div class="v">${money(D.company.metrics.cash)}</div><div class="s">on hand</div></div>
    <div class="metric"><div class="k">Runway</div><div class="v">${D.company.metrics.runwayMonths!=null?D.company.metrics.runwayMonths+" mo":"—"}</div><div class="s">months</div></div>
    <div class="metric"><div class="k">MRR</div><div class="v">${money(D.company.metrics.mrr)}</div><div class="s">recurring</div></div>
    <div class="metric"><div class="k">Clients</div><div class="v">${D.company.metrics.clients??"—"}</div><div class="s">paying</div></div></div>
    <div class="panel"><h2 class="sec">Finance agents</h2>${agentRows(agents.filter(a=>a.group==="Finance"))}
    <div class="note">Charles owns these numbers (weekly pulse + monthly close). Cash/runway populate when set; deeper figures flow in when QuickBooks connects.</div></div>`;

  // Delivery
  $("#v-delivery").innerHTML = `<div class="panel"><h2 class="sec">Delivery agents</h2>${agentRows(agents.filter(a=>a.group==="Delivery"))}
    <div class="note">Activates at the first signed deal: Janice onboards → Kimi builds (48h) → Kortney keeps it healthy.</div></div>`;

  // Compliance
  const cg=(DV.gates&&DV.gates.counsel)||null;
  $("#v-compliance").innerHTML = (DV.gates?`<div class="panel"><h2 class="sec">Master gates — live from the trackers</h2>
    <table><tr><th>Gate</th><th>Status</th></tr>
    <tr><td>OtherVenture (master launch gate)<div class="mut" style="font-size:12px">processes/launch-gate.md — the only place its state lives</div></td><td><span class="badge b-open">${esc(DV.gates.OtherVenture)}</span></td></tr>
    ${cg?`<tr><td>Counsel gates (Ray)<div class="mut" style="font-size:12px">processes/counsel-gates.md</div></td><td><span class="badge ${cg.cleared===cg.total?"b-done":"b-open"}">${cg.cleared}/${cg.total} cleared</span> <span class="mut" style="font-size:12px">${cg.blockedHard} hard-blocked · ${cg.awaitingCounsel} awaiting counsel · ${cg.notStarted} not started</span></td></tr>`:""}
    </table></div>`:"")+
    `<div class="panel" style="margin-top:16px"><h2 class="sec">Compliance gates</h2><table><tr><th>Gate</th><th>Status</th></tr>
    ${(D.compliance||[]).map(c=>{const b=c.status.startsWith("done")?"b-done":c.status.startsWith("open")?"b-open":"b-pending";return `<tr><td>${esc(c.gate)}</td><td><span class="badge ${b}">${esc(c.status)}</span></td></tr>`;}).join("")}</table></div>`;

  // Scale readiness — platform decisions to lock before client #2
  $("#v-scale").innerHTML = `<div class="panel"><h2 class="sec">Scale readiness — lock before client #2</h2>
    <div class="note">${esc((D.scaleReadiness&&D.scaleReadiness.note)||"")}</div>
    <table><tr><th>Decision</th><th>Status</th><th>Owner</th></tr>
    ${((D.scaleReadiness&&D.scaleReadiness.items)||[]).map(s=>`<tr><td>${esc(s.item)}<div class="mut" style="font-size:12px">${esc(s.detail||"")}</div></td><td><span class="badge b-open">${esc(s.status)}</span></td><td>${esc(s.owner||"")}</td></tr>`).join("")}</table></div>`;

  // Loops — health derived live from the repo (systemd timers × committed artifacts); registry is canonical
  const hb=h=>({"on-time":"b-live","stale":"b-open","never":"b-open","untracked":"b-pending","n/a":"b-pending"}[h]||"b-pending");

// compact CSP-safe markdown renderer: escape HTML first, then transform (headers, bold, italic,
// tables, lists, code, blockquotes, hr). No external libs.
function mdInline(s){
  const codes=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return "\u0000"+(codes.length-1)+"\u0000";});
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/__([^_]+)__/g,"<b>$1</b>");
  s=s.replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/(^|[\s(])_([^_\n]+)_/g,"$1<i>$2</i>");
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>/^(https?:\/\/|\/|#)/.test(u)?`<a class="link" href="${u}" target="_blank" rel="noopener">${t}</a>`:m);
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>`<code>${codes[+i]}</code>`);
}
function mdRender(md){
  const L=esc(md).split(/\r?\n/),out=[];let i=0,list=null,quote=false,fence=false,fbuf=[];
  const closeList=()=>{if(list){out.push(list==="ul"?"</ul>":"</ol>");list=null;}};
  const closeQuote=()=>{if(quote){out.push("</blockquote>");quote=false;}};
  while(i<L.length){
    const ln=L[i];
    if(/^\s*```/.test(ln)){ if(fence){out.push(`<pre>${fbuf.join("\n")}</pre>`);fbuf=[];fence=false;} else {closeList();closeQuote();fence=true;} i++; continue; }
    if(fence){fbuf.push(ln);i++;continue;}
    if(/\|/.test(ln)&&i+1<L.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(L[i+1])&&/-/.test(L[i+1])){ // table
      closeList();closeQuote();
      const cells=r=>r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>mdInline(c.trim()));
      let h=`<div class="md-tbl"><table><tr>${cells(ln).map(c=>`<th>${c}</th>`).join("")}</tr>`;
      i+=2;
      while(i<L.length&&/\|/.test(L[i])&&L[i].trim()){h+=`<tr>${cells(L[i]).map(c=>`<td>${c}</td>`).join("")}</tr>`;i++;}
      out.push(h+"</table></div>"); continue;
    }
    const hm=ln.match(/^(#{1,6})\s+(.*)$/);
    if(hm){closeList();closeQuote();const n=hm[1].length;out.push(`<h${n}>${mdInline(hm[2])}</h${n}>`);i++;continue;}
    if(/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){closeList();closeQuote();out.push("<hr>");i++;continue;}
    if(/^&gt;\s?/.test(ln)){ if(!quote){closeList();out.push("<blockquote>");quote=true;} out.push(mdInline(ln.replace(/^&gt;\s?/,""))+"<br>"); i++; continue; }
    closeQuote();
    const um=ln.match(/^\s*[-*+]\s+(.*)$/), om=ln.match(/^\s*\d+[.)]\s+(.*)$/);
    if(um||om){const want=um?"ul":"ol"; if(list!==want){closeList();out.push(want==="ul"?"<ul>":"<ol>");list=want;} out.push(`<li>${mdInline((um||om)[1])}</li>`); i++; continue;}
    closeList();
    if(!ln.trim()){i++;continue;}
    out.push(`<p>${mdInline(ln)}</p>`); i++;
  }
  if(fence)out.push(`<pre>${fbuf.join("\n")}</pre>`);
  closeList();closeQuote();
  return out.join("");
}
function mdTeaser(md){ // first non-heading line of a report, markers stripped

    return t.replace(/[*_`>#|]/g,"").trim().slice(0,110);
  }
  return "";
}

    else if(cur==null)pace=(k==="marginPct"?esc((GOALS.current&&GOALS.current._marginNote)||"—"):"—");
    else if(paceable&&elapsedPct!=null){const ahead=pct>=elapsedPct;cls=ahead?"ahead":"behind";pace=`${pct}% of target · ${ahead?"ahead of":"behind"} pace (${elapsedPct}% elapsed)`;}
    else pace=pct!=null?pct+"% of target":"";
    const src=(section._sources||{})[k];
    return `<div class="grow" data-goal="${k}"><span class="gm">${label}</span><span class="gc">${fmt(cur)}</span>`+
      `<span class="gtv" data-edit="${k}" title="click to edit target">${t==null?"set target":fmt(t)}<span class="pen">✎</span></span>`+
      `<span class="gpb${t==null?" unset":""}"><i style="width:${pct==null?0:pct}%"></i></span>`+
      `<span class="gpace ${cls}">${pace}</span>`+(src?`<span class="gsrc">${esc(src)}</span>`:"")+`</div>`;
  }).join("");
  return `<div class="panel goal-panel"><div class="ghead"><span class="gt">${esc(title)}</span><span class="gel">${elapsedPct!=null?elapsedPct+"% elapsed · ":""}click any ✎ target to edit</span></div>${rows}</div>`;
}
function renderGoals(){
  const v=$("#v-goals"); if(!v)return;
  if(!GOALS){v.innerHTML='<div class="panel"><div class="note">goals unavailable — is the server running?</div></div>';return;}
  const per=GOALS.period||{}, cur=GOALS.current||{}, qs=GOALS.quarters||{};
  v.innerHTML=`<h2 class="sec">Goals — targets you set, progress the CRM proves</h2><div class="goal-panels">`+
    goalPanel("This quarter · "+(per.quarterLabel||""),qs[per.quarter]||{targets:{}},cur,per.quarterPctElapsed,true)+
    goalPanel("Next quarter · "+(per.nextQuarterLabel||""),qs[per.nextQuarter]||{targets:{}},cur,null,false)+
    goalPanel("Year · "+((GOALS.year&&GOALS.year.label)||per.yearLabel||""),GOALS.year||{targets:{}},cur,per.yearPctElapsed,true)+
    `</div><div class="note" style="margin-top:10px">Currents are computed live from the CRM on every refresh — nothing here is typed twice. Click any target to edit; prefills marked "edit me" came from the business plan.</div>`;
  v.querySelectorAll(".gtv").forEach(elm=>{elm.onclick=()=>startGoalEdit(elm);});
}
function startGoalEdit(elm){
  if(GOAL_EDITING)return;
  GOAL_EDITING=true;
  const k=elm.dataset.edit, panel=elm.closest(".goal-panel"), per=GOALS.period||{};
  const title=panel.querySelector(".gt").textContent;
  const scope=title.startsWith("Year")?{year:true}:{quarter:title.includes(per.nextQuarterLabel)?per.nextQuarter:per.quarter};
  const currentTarget=elm.textContent==="set target"?"":elm.textContent.replace(/[$,%\s,]/g,"");
  elm.innerHTML=`<input type="number" step="any" value="${esc(currentTarget)}">`;
  const inp=elm.querySelector("input"); inp.focus(); inp.select();
  const done=async save=>{
    GOAL_EDITING=false;
    if(save){
      const val=inp.value.trim()===""?null:Number(inp.value);
      const targets={[k]:(val==null||isNaN(val))?null:val};
      const body=scope.year?{year:{targets}}:{quarters:{[scope.quarter]:{targets}}};
      try{const r=await fetch("/api/goals",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
          if(r.ok){GOALS=await r.json();}}catch(e){}
    }
    renderGoals(); renderGoalBand();
  };
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")done(true); if(e.key==="Escape")done(false);});
  inp.addEventListener("blur",()=>done(true));
}
function showView(v){const t=document.querySelector('.tab[data-v="'+v+'"]');if(!t)return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); t.classList.add("active");
  document.querySelectorAll(".view").forEach(x=>x.classList.add("hidden")); $("#v-"+v).classList.remove("hidden");
  if(v==="reports")initReports();
  if(v==="goals")renderGoals();}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{location.hash=t.dataset.v;}));

loadTodo();

if(location.hash) showView(location.hash.slice(1));

function greet(){const h=new Date().getHours();return h<12?"Mornin'":h<17?"Good afternoon":"Evenin'";}
function renderMelanie(){const el=document.getElementById("jarvis"); if(!el)return;
  el.innerHTML=`<span>&#9656; Melanie online &mdash; ${greet()}, the Founder.</span><span class="b">Everything's runnin' just fine, sugar.</span><span class="clk" id="clk"></span>`; tick();}
function tick(){const c=document.getElementById("clk"); if(!c)return; const d=new Date();
  c.innerHTML=`${d.toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"})} &middot; ${d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})}`;}
// Melanie's brain (Phase 1: grounded answers from live data; Phase 2 swaps to Claude API for open-ended Q&A)
function askMelanie(q){ q=(q||"").toLowerCase();
  const co=(D&&D.company)||{}, m=co.metrics||{}, ag=(D&&D.agents)||[], P=(D&&D.pipeline)||{}, L=(D&&D.loops)||[], T=(D&&D.tasks)||[];
  const live=ag.filter(a=>a.status==="live").length;
  const liveNames=()=>ag.filter(a=>a.status==="live").map(a=>a.name).join(", ");
  if(/\b(hi|hey|hello|mornin|good (morning|afternoon|evening)|how are you|how ya|sup)\b/.test(q)) return `${greet()}, the Founder! Everything's runnin' just fine. What can I get ya?`;
  if(/thank/.test(q)) return `Anytime, sugar.`;
  if(/(your name|who are you|what are you)/.test(q)) return `I'm Melanie, hon — yourco's CEO-in-trainin' and your right hand 'round here. Ask me about the leads, the team, the money, or what's on this week.`;
  if(/(pipeline|lead|deal|prospect)/.test(q)){
    if(/(value|worth|much|revenue|money)/.test(q)) return P.value!=null?`The pipeline's worth about $${P.value.toLocaleString()} across ${P.openDeals||0} open deals, hon.`:`We've got ${P.openDeals||0} open deals right now.`;
    return `You've got ${P.openDeals!=null?P.openDeals:"a few"} deals in the pipeline${P.companies?`, across ${P.companies} companies`:""}, sugar.${P.value?` About $${P.value.toLocaleString()} all told.`:""}`;
  }
  if(/(agent|employee|team|roster|who('?s| is| are) (live|on|workin|active))/.test(q)){
    if(/(live|workin|active|online|right now)/.test(q)) return `${live} of our ${ag.length} are live and workin' right now — ${liveNames()}.`;
    return `We've got ${ag.length} AI employees on the team, and ${live} are live, hon.`;
  }
  if(/(task|reminder|due|sticky|deadline|to.?do)/.test(q)){
    const open=T.filter(t=>!t.done); if(!open.length) return `Task list's all clear, sugar — nothin' open right now.`;
    const today=new Date().toISOString().slice(0,10);
    const over=open.filter(t=>t.due&&t.due<today), tod=open.filter(t=>t.due===today);
    const soon=open.filter(t=>!t.due||t.due>today).sort((a,b)=>((a.due||"9999")<(b.due||"9999")?-1:1));
    const parts=[];
    if(over.length) parts.push(`${over.length} overdue — ${over.map(t=>t.text).join("; ")}`);
    if(tod.length) parts.push(`due today: ${tod.map(t=>t.text).join("; ")}`);
    if(soon.length) parts.push(`comin' up: ${soon.slice(0,3).map(t=>t.text+(t.due?` (${t.due})`:"")).join("; ")}`);
    return `You've got ${open.length} open task${open.length===1?"":"s"}${over.length?`, and ${over.length} overdue, hon`:""}. ${parts.join(". ")}.`;
  }
  if(/(focus|priorit|this week|what should|what'?s next|next)/.test(q)){ const f=co.focus||[]; return f.length?`This week we're focused on: ${f.join("; ")}.`:`Nothin' flagged for this week just yet.`; }
  if(/(loop|automat)/.test(q)) return `There are ${L.length} closed loops set up${m.loopsArmed?`, and ${m.loopsArmed} are armed and runnin'`:""}.`;
  if(/(client|customer)/.test(q)) return `${m.clients||0} clients live so far, hon — we can't go live 'til the OtherVenture matter clears.`;
  if(/(mrr|cash|runway|finance|how much.*(make|made|earn)|profit)/.test(q)||(/revenue/.test(q)&&!/pipeline/.test(q))) return `We're pre-revenue, sugar — MRR's at $${m.mrr||0} and no clients are live yet. The whole machine's built and just waitin' on launch.`;
  if(/(trust|reliable|reliab|safe|gate|guardrail|eval|autonom|can.*(send|delete)|approval)/.test(q)){ const tr=(D&&D.trust)||{}, g=tr.gate||{}; return `${tr.posture||"Eval-gated, human-in-the-loop"}, sugar. The agents can ${(g.allow||[]).join(", ").toLowerCase()||"read and draft"} on their own, but they're flat-out blocked from ${(g.deny||[]).join(", ").toLowerCase()||"sendin' or deletin'"} — always-on doesn't mean auto-send. That gate's the whole moat, hon.`; }
  if(/(compliance|legal|contract|counsel)/.test(q)) return `The contracts are drafted and waitin' on counsel review, hon — that's Rafi and Ray's department, and it's top of this week's list.`;
  if(/(status|stage|how('?s| are) (things|we|it|yourco)|where (are we|do we stand)|launch|ready|OtherVenture)/.test(q)) return `${co.stage||"In build"}, sugar. ${live} agents live, ${P.openDeals||0} leads in the pipeline. We're staged and ready — just waitin' on OtherVenture to clear, then it's a switch-flip.`;
  return `I can't speak to that one just yet, sugar — once the Founder wires up my full brain (the Claude + ElevenLabs bit), I'll know it all. For now, ask me about the leads, the pipeline, the team, this week's focus, or how we're doin'.`;
}
function orbSpeak(on){ const o=document.getElementById("mel-orb"); if(o) o.classList.toggle("speaking",!!on); }
function speak(t){ try{const u=new SpeechSynthesisUtterance(t);const vs=speechSynthesis.getVoices();
  const pick=vs.find(v=>/en-US/.test(v.lang)&&/(female|samantha|ava|allison|zoe|karen|tessa|nicky|susan)/i.test(v.name))||vs.find(v=>/en-US/.test(v.lang))||vs[0];
  if(pick)u.voice=pick;u.rate=.96;u.pitch=1.08;u.onstart=()=>orbSpeak(true);u.onend=()=>orbSpeak(false);u.onerror=()=>orbSpeak(false);speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){} }
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function melReply(a,q){const log=document.getElementById("mel-log");if(!log)return;if(q)log.insertAdjacentHTML("beforeend",`<div class="mq">${esc(q)}</div>`);log.insertAdjacentHTML("beforeend",`<div class="ma">${esc(a)}</div>`);log.scrollTop=log.scrollHeight;}
function srcChips(srcs){ if(!srcs||!srcs.length)return ""; const chips=srcs.map(s=>`<span class="srcchip">${esc((s.split("/").pop()||s))}</span>`).join(""); return `<div class="masrc" title="${esc(srcs.join("  ·  "))}"><span class="lbl">grounded in</span>${chips}</div>`; }
function playAudio(dataUrl){ // ElevenLabs Southern voice; returns true if it started
  try{const au=new Audio(dataUrl);au.onplay=()=>orbSpeak(true);au.onended=()=>orbSpeak(false);au.onerror=()=>orbSpeak(false);au.play();return true;}catch(e){return false;} }
function renderTicker(){ // live pulse of agent activity across the OS
  const D=(P&&P.dashboard)||{}, pipe=(P&&P.pipeline)||{};
  const ag=D.agents||[], live=ag.filter(a=>a.status==="live");
  const items=[`<span class="ticker-item"><span class="pip"></span><b>SYSTEM</b> yourco HQ · loops nominal</span>`];
  live.forEach(a=>items.push(`<span class="ticker-item"><span class="pip"></span><b>${esc(a.name)}</b> ${esc(a.role||"")} · live</span>`));
  (D.loops||[]).slice(0,8).forEach(l=>{const nm=typeof l==="string"?l:(l.name||l.label||"");items.push(`<span class="ticker-item"><span class="pip brass"></span><b>LOOP</b> ${esc(nm)} · armed</span>`);});
  items.push(`<span class="ticker-item"><span class="pip brass"></span><b>PIPELINE</b> ${pipe.openDeals||0} in motion · ${pipe.prospects||0} prospects</span>`);
  items.push(`<span class="ticker-item"><span class="pip"></span><b>AGENTS</b> ${live.length}/${ag.length} live</span>`);
  const row=items.join("");
  const t=document.getElementById("ticker-track"); if(t) t.innerHTML=row+row; // ×2 = seamless loop
}
// Phase 2: ask the local /api/melanie brain (Claude + ElevenLabs). Falls back to the
// Phase-1 grounded intent-matcher + browser speech when the backend/keys aren't wired.
async function melAsk(q){q=(q||"").trim();if(!q)return;
  const inp=document.getElementById("mel-input");if(inp)inp.value="";
  const log=document.getElementById("mel-log");
  if(log){log.insertAdjacentHTML("beforeend",`<div class="mq">${esc(q)}</div>`);
    log.insertAdjacentHTML("beforeend",`<div class="ma" id="mel-pending"><span class="dots">thinkin'…</span></div>`);
    log.scrollTop=log.scrollHeight;}
  const pend=document.getElementById("mel-pending");
  const finish=(text,audio,sources)=>{ if(pend){pend.removeAttribute("id");pend.textContent=text; if(sources&&sources.length)pend.insertAdjacentHTML("afterend",srcChips(sources));}
    else{melReply(text); if(sources&&sources.length&&log)log.insertAdjacentHTML("beforeend",srcChips(sources));} if(log)log.scrollTop=log.scrollHeight;
    if(!(audio&&playAudio(audio)))speak(text); };
  try{
    const r=await fetch("/api/melanie",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({question:q})});
    const d=await r.json();
    if(d&&d.backend==="live"&&d.text){ finish(d.text,d.audio,d.sources); if(d.applied) load(); return; }
    if(d&&d.backend==="rate_limited"){ finish("Easy now, sugar — give me just a second between questions.",null); return; }
  }catch(e){/* backend down -> Phase-1 */}
  finish(askMelanie(q),null); // brain not wired (or offline): grounded local answer + browser voice
}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const mic=document.getElementById("mel-mic");
  if(!SR){melReply("I can't hear ya in this browser, hon — try Chrome, or just type it to me.");return;}
  const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=1;if(mic)mic.classList.add("on");
  r.onresult=e=>{const t=e.results[0][0].transcript;const inp=document.getElementById("mel-input");if(inp)inp.value=t;melAsk(t);};
  r.onend=()=>{if(mic)mic.classList.remove("on");};r.onerror=()=>{if(mic)mic.classList.remove("on");};
  try{r.start();}catch(e){if(mic)mic.classList.remove("on");}}
(function wireMel(){const send=document.getElementById("mel-send"),inp=document.getElementById("mel-input"),mic=document.getElementById("mel-mic"),x=document.getElementById("mel-x"),mel=document.getElementById("mel");
  if(send)send.onclick=()=>melAsk(inp.value);
  if(inp)inp.addEventListener("keydown",e=>{if(e.key==="Enter")melAsk(inp.value);});
  if(mic)mic.onclick=listen;
  if(x)x.onclick=()=>mel.classList.toggle("mel-collapsed");
})();
if(window.speechSynthesis) speechSynthesis.onvoiceschanged=()=>{};
async function melBriefing(){ // Melanie greets you with a live briefing the moment the HQ opens
  try{
    const r=await fetch("/api/melanie/briefing",{cache:"no-store"});
    const d=await r.json();
    if(d&&d.backend==="live"&&d.text){
      const log=document.getElementById("mel-log");
      if(log){ log.insertAdjacentHTML("beforeend",`<div class="ma">${esc(d.text)}</div>`); log.scrollTop=log.scrollHeight; }
      if(d.audio) playAudio(d.audio); // plays if the browser allows; text shows regardless
    }
  }catch(e){}
}

if(window.innerWidth<=600){const m=document.getElementById("mel"); if(m) m.classList.add("mel-collapsed");} // mobile: start tucked so it doesn't cover content
