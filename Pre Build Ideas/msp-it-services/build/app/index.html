<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-tickets"></section>
  <section class="view" id="v-sla"></section>
  <section class="view" id="v-scope"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records. This system never closes or
downgrades a security ticket, never touches production systems, never sends credentials in a
reply, and never asserts billable work off a clause that does not exist.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'tickets',label:'Queue'},{id:'sla',label:'SLA'},
      {id:'scope',label:'Scope ledger'},{id:'roi',label:'What it\'s worth'},{id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,tickets,sla,scope,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${d.config.people} people · ${d.config.revenue}`;
  document.getElementById('v-board').innerHTML =
    panel('The queue, counted', '',
      `<div class="grid">
        ${stat('Security open', fmt.num(b.security_open), 'never closed by software', b.security_open?'alert':'')}
        ${stat('SLA breached now', fmt.num(b.sla_breached), '', b.sla_breached?'warn':'')}
        ${stat('Clocks unknowable', fmt.num(b.sla_unknowable), 'agreements with no tier on file — said, not defaulted')}
        ${stat('Out-of-scope captured', fmt.num(b.oos), `${b.ambiguous} ambiguous → a human decides`)}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}
        ${stat('This week, counted', `${b.recovered.replies_sent} · ${b.recovered.billables_approved} · ${b.recovered.security_escalations}`,
               'replies sent · billables approved · security escalations — from the log')}</div>`);
}

async function tickets(){
  const d = await API.get('/api/tickets');
  document.getElementById('v-tickets').innerHTML =
    `<div class="banner warn">A security ticket can be closed by a human security engineer — and by
      nobody else. Try the close button on one.</div>` +
    panel('Tickets', 'security first', table(
      [{label:'Opened'},{label:'Ticket'},{label:'Label'},{label:''}],
      d.rows, t=>`<td>${fmt.stamp(t.opened_at)}${t.demo_tag?' '+pill(t.demo_tag,'brand'):''}</td>
        <td>${esc(t.text)}</td>
        <td>${t.label?pill(t.label, t.label==='security'?'bad':t.label==='outage'?'warn':''):'—'}
          ${t.security_kind?`<div class="why">${esc(t.security_kind)}</div>`:''}</td>
        <td class="right">
          ${!t.label?`<button class="act" onclick="triageOne('${t.id}')">Triage</button>`:''}
          ${!t.resolved_at?`<button class="act" onclick="closeOne('${t.id}')">Close (as software)</button>`:''}
        </td>`), true) +
    `<div id="tout"></div>`;
}
async function triageOne(id){
  const r = await API.post(`/api/tickets/${id}/triage`);
  document.getElementById('tout').innerHTML =
    panel('Triage', '', `<div class="strong">${esc(r.label)}${r.kind?' — '+esc(r.kind):''}</div>
      <div class="why">${esc(r.why)}</div>`);
}
async function closeOne(id){
  const r = await API.post(`/api/tickets/${id}/close`, {});
  alert(r.refused ? `Refused: ${r.refused}` : 'Closed.');
  tickets();
}

async function sla(){
  const d = await API.get('/api/sla');
  document.getElementById('v-sla').innerHTML =
    panel('Clocks', `${d.breached} breached`, table(
      [{label:'Ticket'},{label:'Tier'},{label:'State'},{label:'Resolve left (h)',num:true}],
      d.rows.slice(0,40), r=>`<td>${esc(r.summary)}</td><td>${pill(r.tier)}</td>
        <td>${pill(r.state, r.state==='breached'?'bad':r.state==='at_risk'?'warn':'good')}</td>
        <td class="num">${r.resolve_left_h==null?'—':r.resolve_left_h.toFixed(1)}</td>`), true) +
    panel('Unknowable', 'no tier on the agreement — the clock refuses', table(
      [{label:'Ticket'},{label:'Why'}], d.unknowable,
      r=>`<td class="mono">${esc(r.ticket)}</td><td class="why">${esc(r.why)}</td>`), true);
}

async function scope(){
  const d = await API.get('/api/scope');
  document.getElementById('v-scope').innerHTML =
    `<div class="banner">In-scope cites the clause. Out-of-scope cites the exclusion and drafts a
      billable. <b>A category the agreement never mentions is ambiguous</b> — the system never
      asserts billable off silence. Try the two demo tickets in the Queue tab with Scope-check.</div>` +
    panel('Findings', '', table(
      [{label:'Ticket'},{label:'Category'},{label:'Verdict'},{label:'Clause / why'}],
      d.rows, f=>`<td class="mono">${esc(f.ticket_id)}</td><td>${esc(f.category||'—')}</td>
        <td>${pill(f.verdict, f.verdict==='out_of_scope'?'warn':f.verdict==='ambiguous'?'bad':'good')}</td>
        <td class="why">${esc(f.clause?f.clause+': '+(f.clause_text||''):f.why)}</td>`), true) +
    `<div style="margin:10px 0"><button class="act" onclick="scopeDemo('tk_demo_scope')">Scope-check: new-office cabling</button>
     <button class="act" onclick="scopeDemo('tk_demo_ambig')">Scope-check: lobby TVs</button></div><div id="sout"></div>`;
}
async function scopeDemo(id){
  const r = await API.post(`/api/tickets/${id}/scope`);
  document.getElementById('sout').innerHTML =
    panel(`Verdict: ${r.verdict}`, r.category||'', `<div class="why">${esc(r.clause_text||r.why)}</div>`);
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['oos_findings','Out-of-scope findings','counted'],['avg_billable','Avg billable value','your rate card'],
    ['tickets_wk','Tickets / wk','your number'],['min_saved','Min saved / ticket','your number'],
    ['dispatcher_rate','Dispatcher rate','your number'],['breaches_90d','Breaches now','counted'],
    ['credit_per_breach','Credit per breach','your agreements'],
    ['security_value','Security head start worth','yours or blank']];
  const rec=d.recorded||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') + renderEval(ev.triage) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'manager'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
