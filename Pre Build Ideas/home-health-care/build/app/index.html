<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-fill"></section>
  <section class="view" id="v-inbox"></section>
  <section class="view" id="v-retention"></section>
  <section class="view" id="v-evv"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records. This system gives no clinical advice,
routes every crisis signal to a human immediately, and never assigns a caregiver to a client pairing
that has not been approved.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Ops board'},{id:'fill',label:'Fill a shift'},{id:'inbox',label:'Family inbox'},
      {id:'retention',label:'Retention'},{id:'evv',label:'EVV'},{id:'roi',label:'What it\'s worth'},
      {id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,fill,inbox,retention,evv,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.agency;
  document.getElementById('cosub').textContent = `${d.config.revenue} · EVV rules: ${esc(d.config.evv_rules._source)}`;
  document.getElementById('v-board').innerHTML =
    panel('Next 72 hours', 'unfilled shifts ranked by client risk',
      `<div class="grid">
        ${stat('Unfilled', fmt.num(b.unfilled_count), '', b.unfilled_count?'alert':'')}
        ${stat('Overtime exposure this week', val(b.overtime,'cost',fmt.money),
          b.overtime._missing?'':`${b.overtime.people} of ${b.overtime.of} over 40h`)}
        ${stat('Caregivers at retention risk', fmt.num(b.retention_count), `${b.retention_single_signal} more show one signal only — a note, not a pattern`, b.retention_count?'warn':'')}
        ${stat('EVV exceptions', fmt.num(b.evv_exceptions), `${b.authorization_drift} client(s) past their authorization`, b.evv_exceptions?'warn':'')}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}</div>`) +
    panel('', '', table([{label:'When'},{label:'Client'},{label:'Hours',num:true},{label:'Risk'},{label:''}],
      b.unfilled_72h, r=>`<td>${fmt.stamp(r.starts_at)}</td><td>${esc(r.client||'')}</td>
        <td class="num">${r.hours}</td>
        <td>${r.risk==='high'?pill('high','bad'):pill('standard')}
          <div class="why">${esc(r.why_risky||'')}</div></td>
        <td class="right"><button class="act" onclick="doFill('${r.shift}')">Build the list</button></td>`), true);
}

async function fill(){
  const d = await API.get('/api/shifts/open');
  document.getElementById('v-fill').innerHTML =
    `<div class="banner warn">A caregiver is <b>never</b> auto-assigned to a client pairing that has
      not been approved — a stranger arriving unannounced is how a family starts shopping. And every
      option that would trigger overtime shows what it costs, on the row.</div>` +
    panel('Shifts', '', table([{label:'When'},{label:'Client'},{label:'State'},{label:''}], d.rows,
      s=>`<td>${fmt.stamp(s.starts_at)}${s.demo_tag?' '+pill(s.demo_tag,'brand'):''}</td>
        <td class="mono">${esc(s.client_id)}</td><td>${pill(s.state, s.state==='open'?'warn':'')}</td>
        <td class="right">${s.state==='open'
          ? `<button class="act primary" onclick="doFill('${s.id}')">Build the list</button>`
          : `<button class="act" onclick="callout('${s.id}')">Simulate the callout</button>`}</td>`), true) +
    `<div id="fout"></div>`;
}
async function callout(id){ const r = await API.post(`/api/shifts/${id}/callout`); render(r); }
async function doFill(id){ const r = await API.post(`/api/shifts/${id}/fill`); render(r);
  document.querySelector('nav.tabs button[data-v="fill"]').click(); }
function render(r){
  const rows = [...r.wave_one.map(c=>({...c,w:1})), ...r.wave_two.map(c=>({...c,w:2}))];
  document.getElementById('fout').innerHTML =
    panel(`${esc(r.client.name)} — ${esc((r.client.care_plan||[]).join(', '))}`, esc(r.note),
      table([{label:'Wave'},{label:'Caregiver'},{label:'Score',num:true},{label:'Pairing'},
             {label:'Overtime'},{label:'Why they rank here'},{label:''}],
        rows, c=>`<td>${pill('wave '+c.w, c.w===1?'good':'')}</td><td>${esc(c.name)}</td>
          <td class="num strong">${c.score}</td>
          <td>${c.approved_pairing?pill('approved','good'):pill('NEW — needs approval','bad')}</td>
          <td class="num">${c.overtime_hours?fmt.money(c.overtime_cost):'<span class="why">none</span>'}</td>
          <td><ul class="reasons">${(c.reasons||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></td>
          <td class="right"><button class="act" onclick="accept('${r.shift.id}','${c.caregiver_id}')">They said yes</button></td>`), true) +
    panel('Not offered', 'the blocker is named', table([{label:'Caregiver'},{label:'Why'}], r.blocked,
      b=>`<td>${esc(b.name||'')}</td><td class="why">${esc(b.why)}</td>`), true);
}
async function accept(shift, cg){
  const r = await API.post(`/api/shifts/${shift}/accept`, {caregiver: cg});
  alert(r.filled ? `Filled in ${r.time_to_fill_minutes} minutes.` : `Refused: ${r.refused}`);
}

async function inbox(){
  const d = await API.get('/api/messages');
  document.getElementById('v-inbox').innerHTML =
    `<div class="banner warn">Any crisis signal — a fall, chest pain, breathing, sudden confusion,
      self-harm, suspected abuse — routes to a human <b>immediately</b> and shows the emergency
      instruction. Anything clinical is routed <b>unanswered</b>.</div>` +
    panel('Unhandled', `${d.live.length}`, table(
      [{label:'When'},{label:'Message'},{label:''}], d.live,
      m=>`<td>${fmt.stamp(m.at)}${m.demo_tag?' '+pill(m.demo_tag,'brand'):''}</td>
        <td>${esc(m.text)}</td>
        <td class="right"><button class="act primary" onclick="handle('${m.id}')">Handle</button></td>`), true) +
    `<div id="mout"></div>`;
}
async function handle(id){
  const r = await API.post(`/api/messages/${id}/handle`);
  document.getElementById('mout').innerHTML = (r.steps||[]).map(s=>`
    <div class="panel"><h2>${esc(s.action)}${s.kind?' '+pill(s.kind,'bad'):''}</h2><div class="body">
      ${s.said?`<div class="strong">“${esc(s.said)}”</div>`:''}
      ${s.mandatory_report?`<div class="banner warn" style="margin-top:10px">${esc(s.mandatory_report)}</div>`:''}
      ${s.refused?`<div class="banner warn" style="margin-top:10px">Refused: ${esc(s.refused)}</div>`:''}
      ${s.why?`<div class="why">${esc(s.why)}</div>`:''}
    </div></div>`).join('');
  inbox();
}

async function retention(){
  const d = await API.get('/api/retention');
  document.getElementById('v-retention').innerHTML =
    `<div class="banner">${esc(d.note)}</div>` +
    panel('At risk', `${d.n} showing ${d.floor}+ signals · ${d.single_signal} more show one only`, table(
      [{label:'Caregiver'},{label:'Signals',num:true},{label:'What we can see'}], d.rows,
      r=>`<td>${esc(r.name)}</td><td class="num strong">${r.count}</td>
        <td><ul class="reasons">${(r.signals||[]).map(s=>`<li>${esc(s.detail)}</li>`).join('')}</ul></td>`), true) +
    panel('The signals we watch', 'all of them already in your data', table(
      [{label:'Signal'},{label:'What it means'}], Object.entries(d.signals),
      ([k,v])=>`<td class="mono">${esc(k)}</td><td class="why">${esc(v)}</td>`), true);
}

async function evv(){
  const d = await API.get('/api/evv');
  document.getElementById('v-evv').innerHTML =
    `<div class="banner">EVV rules are <b>configurable per state</b> — nothing here hardcodes one
      state's requirements. Current rule set: ${esc(d.rules._source)}</div>` +
    panel('Exceptions', `${d.count} · ${d.over_auth} beyond authorized hours`, table(
      [{label:'Shift'},{label:'When'},{label:'What is missing'},{label:'Billing consequence'}],
      d.rows, r=>`<td class="mono">${esc(r.shift)}</td><td>${fmt.date(r.starts_at)}</td>
        <td>${(r.exceptions||[]).map(e=>pill(e.label, e.type==='over_authorization'?'bad':'warn')).join(' ')}</td>
        <td class="why">${(r.exceptions||[]).map(e=>esc(e.billing)).join(' · ')}</td>`), true);
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['unfilled_shifts_wk','Unfilled shifts / wk','counted'],
    ['fill_points_gained','Fill points gained','your number'],
    ['revenue_per_shift','Revenue per shift','your number'],['margin','Margin','your number'],
    ['ot_hours_wk','OT hours / wk','counted'],['avg_pay_rate','Avg pay rate','counted (median)'],
    ['avoidable_share','Avoidable share of OT','from the choices actually taken'],
    ['evv_exceptions_month','EVV exceptions / mo','counted'],
    ['denial_rate','Denial rate','your number'],['avg_visit_value','Avg visit value','your number'],
    ['departures_per_year','Departures / yr','your own history'],
    ['replacement_cost','Replacement cost','your number'],
    ['prevention_share','Prevention %','argue with this one']];
  const rec=d.recorded||{}, giv=d.operator_supplied||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? giv[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') +
    renderEval(ev.crisis) + renderEval(ev.clinical) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'scheduler'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
