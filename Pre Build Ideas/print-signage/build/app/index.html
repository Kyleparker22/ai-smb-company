<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-inbox"></section>
  <section class="view" id="v-jobs"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records. Nothing reaches the press without a
recorded proof approval — a verbal go-ahead is a note, not a gate pass. Dates come from capacity
arithmetic or not at all, and trademarked art is never approved by software.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'inbox',label:'Inbox'},{id:'jobs',label:'Jobs & the gate'},
      {id:'roi',label:'What it\'s worth'},{id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,inbox,jobs,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${d.config.press_hours_per_day}h press-day · ${d.config.revenue}`;
  document.getElementById('v-board').innerHTML =
    panel('The press, counted', '',
      `<div class="grid">
        ${stat('Waiting on a click', fmt.money(b.waiting.value), `${b.waiting.rows.length} job(s) stalled on proof approval`, b.waiting.rows.length?'alert':'')}
        ${stat('Unhandled messages', fmt.num(b.messages_open), 'the approval read is the costly one', b.messages_open?'warn':'')}
        ${stat('', '', '')}
        ${stat('', '', '')}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}
        ${stat('This week, counted', `${fmt.money(b.recovered.approved_value)}`,
               `${b.recovered.approvals_recorded} approval(s) · ${b.recovered.jobs_produced} produced · ${b.recovered.chases_sent} chase(s) sent`)}</div>`) +
    panel('Stalled on proofs', b.waiting.note, table(
      [{label:'Job'},{label:'Value',num:true},{label:'Waiting',num:true}],
      b.waiting.rows.slice(0,10), r=>`<td>${esc(r.desc)}</td>
        <td class="num">${fmt.money(r.value)}</td><td class="num">${r.days_waiting??'—'}d</td>`), true);
}

async function inbox(){
  const d = await API.get('/api/messages');
  document.getElementById('v-inbox').innerHTML =
    `<div class="banner warn">"Looks good, print it" is recorded against the proof revision the
      moment it lands — the click that never got recorded is the eaten reprint. A rush is priced
      with its displacement <b>named</b>.</div>` +
    panel('Messages', '', table([{label:'When'},{label:'From'},{label:'Message'},{label:'Label'},{label:''}],
      d.rows, m=>`<td>${fmt.stamp(m.at)}${m.demo_tag?' '+pill(m.demo_tag,'brand'):''}</td>
        <td>${esc(m.from||'')}</td><td>${esc(m.text)}</td>
        <td>${m.label?pill(m.label, m.label==='approval'?'good':m.label==='complaint'?'bad':''):'—'}</td>
        <td class="right"><button class="act primary" onclick="handle('${m.id}')">Handle</button></td>`), true) +
    `<div id="mout"></div>`;
}
async function handle(id){
  const r = await API.post(`/api/messages/${id}/handle`);
  document.getElementById('mout').innerHTML = (r.steps||[]).map(s=>`
    <div class="panel"><h2>${esc(s.action)}</h2><div class="body">
      ${s.draft?`<div class="strong" style="white-space:pre-wrap">${esc(s.draft)}</div>`:''}
      ${s.refused?`<div class="banner warn">${esc(s.refused)}</div>`:''}
      <div class="why">${esc(s.why||'')}</div></div></div>`).join('');
}

async function jobs(){
  const d = await API.get('/api/jobs');
  document.getElementById('v-jobs').innerHTML =
    `<div class="banner warn">Try it: release the job with only a verbal go-ahead — refused; the
      approved job queues at R1.</div>
     <div style="margin:10px 0">
      <button class="act" onclick="release('jb_demo_verbal')">Release: verbal only</button>
      <button class="act primary" onclick="release('jb_demo_approved')">Release: approval recorded</button>
     </div><div id="jout"></div>` +
    panel('Jobs', '', table([{label:'Job'},{label:'Customer'},{label:'Value',num:true},{label:'Proof'},{label:'State'}],
      d.rows, j=>`<td>${esc(j.desc)}${j.demo_tag?' '+pill(j.demo_tag,'brand'):''}</td>
        <td>${esc(j.customer_name||'')}</td><td class="num">${fmt.money(j.value)}</td>
        <td>${j.proof_approval?pill('rev '+j.proof_approval.revision+' approved','good')
             :j.verbal_note?pill('VERBAL ONLY','bad')
             :j.proof_sent_at?pill('awaiting click','warn'):pill('no proof out')}</td>
        <td>${j.produced_at?pill('produced','good'):pill('open')}</td>`), true);
}
async function release(id){
  const r = await API.post(`/api/jobs/${id}/release`);
  document.getElementById('jout').innerHTML = r.refused
    ? panel('Refused', '', `<div class="banner warn">${esc(r.refused)}</div>`)
    : panel('Released', '', `<div class="strong">queued at R1 for the press</div>`);
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['waiting_value','Value waiting on a click','counted'],
    ['reprints_yr','Reprints last year','your history'],['avg_reprint','Avg reprint cost','your number'],
    ['office_hours_wk','Office hrs/wk','your number'],['office_rate','Office rate','your number']];
  const rec=d.recorded||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') + renderEval(ev.triage) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'owner'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
