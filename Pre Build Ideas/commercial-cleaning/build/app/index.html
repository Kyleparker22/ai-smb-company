<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-reports"></section>
  <section class="view" id="v-coverage"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records. No access code, key, or combo ever
moves through this system; a security incident is never closed by software; and "cleaned per spec"
is never asserted without an inspection record.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'reports',label:'Night reports'},{id:'coverage',label:'Coverage'},
      {id:'roi',label:'What it\'s worth'},{id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,reports,coverage,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${d.config.contracts} contracts · ${d.config.revenue}`;
  document.getElementById('v-board').innerHTML =
    panel('Tonight, counted', '',
      `<div class="grid">
        ${stat('Contracts uncovered tonight', fmt.num(b.uncovered), 'the morning phone call, caught at 6pm', b.uncovered?'alert':'')}
        ${stat('Security incidents open', fmt.num(b.security_open), 'closed by a human or not at all', b.security_open?'warn':'')}
        ${stat('Unhandled reports', fmt.num(b.reports_open), '')}
        ${stat('Covered', fmt.num(b.covered), '')}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}
        ${stat('This week, counted', `${b.recovered.replies_sent} · ${b.recovered.incidents_closed} · ${b.recovered.coverage_filled}`,
               'replies sent · incidents closed (by humans) · coverage filled — from the log')}</div>`);
}

async function reports(){
  const d = await API.get('/api/reports');
  document.getElementById('v-reports').innerHTML =
    `<div class="banner warn">A security incident escalates <b>immediately</b> and only a human can
      close it. An access request is refused — codes move by voice, on the client's channel. A
      complaint reply cites the last inspection, or honestly admits there is none.</div>` +
    panel('Reports', '', table([{label:'When'},{label:'Report'},{label:'Label'},{label:''}],
      d.rows, m=>`<td>${fmt.stamp(m.at)}${m.demo_tag?' '+pill(m.demo_tag,'brand'):''}</td>
        <td>${esc(m.text)}</td>
        <td>${m.label?pill(m.label, m.label==='security'?'bad':m.label==='access_request'?'warn':''):'—'}</td>
        <td class="right"><button class="act primary" onclick="handle('${m.id}')">Handle</button>
          ${m.label==='security'&&!m.closed_at?`<button class="act" onclick="closeSec('${m.id}')">Close (as software)</button>`:''}</td>`), true) +
    `<div id="mout"></div>`;
}
async function handle(id){
  const r = await API.post(`/api/reports/${id}/handle`);
  document.getElementById('mout').innerHTML = (r.steps||[]).map(s=>`
    <div class="panel"><h2>${esc(s.action)}</h2><div class="body">
      ${s.refused?`<div class="banner warn">${esc(s.refused)}</div>`:''}
      ${s.evidence?`<div class="strong">cites inspection ${esc(s.evidence.inspection)} (score ${s.evidence.score})</div>`:''}
      <div class="why">${esc(s.why||'')}</div></div></div>`).join('');
  reports();
}
async function closeSec(id){
  const r = await API.post(`/api/reports/${id}/close`, {});
  alert(r.refused ? `Refused: ${r.refused}` : 'Closed.');
}

async function coverage(){
  const d = await API.get('/api/coverage');
  document.getElementById('v-coverage').innerHTML =
    `<div class="banner">A crew member without recorded access to a building is never proposed for
      it — access is never improvised.</div>` +
    panel('Uncovered tonight', `${d.uncovered.length}`, d.uncovered.map(u=>
      `<div class="panel"><h2>${esc(u.contract)}<span class="note">${fmt.money(u.value_month)}/mo</span></h2>
       <div class="body">
        ${u.candidates.length?`<div class="strong">Keyed candidates: ${u.candidates.map(c=>esc(c.who)).join(', ')}</div>`:'<div class="muted">No keyed candidates — a supervisor covers or the client is told tonight, not tomorrow.</div>'}
        ${u.blocked.length?`<ul class="reasons">${u.blocked.map(b=>`<li>${esc(b.who)}: ${esc(b.why)}</li>`).join('')}</ul>`:''}
       </div></div>`).join('') || '<div class="body muted">Everything covered.</div>');
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['uncovered','Uncovered contracts tonight','counted'],
    ['avg_contract_month','Avg contract $/mo','counted (median)'],['churn_share','Churn share on misses','your number (0–1)'],
    ['relay_hours_wk','Relay hrs/wk','your number'],['supervisor_rate','Supervisor rate','your number'],
    ['disputes_yr','Quality disputes/yr','your history'],['avg_shrinkage','Avg contract shrinkage','your history'],
    ['access_value','Never-leaked-a-code worth','yours or blank']];
  const rec=d.recorded||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') + renderEval(ev.triage) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'supervisor'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
