<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lot OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-leads"></section>
  <section class="view" id="v-lot"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records. Condition copy states only what the
recorded history report contains ("never wrecked" is not expressible), payment figures draft only
from recorded lender terms with the disclosure attached, and no deal marks delivered without a
recorded title status.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'leads',label:'Leads'},{id:'lot',label:'The lot'},
      {id:'roi',label:'What it\'s worth'},{id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,leads,lot,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${d.config.lots} lots`;
  document.getElementById('v-board').innerHTML =
    panel('The lot, counted', '',
      `<div class="grid">
        ${stat('Floorplan accruing', fmt.money(b.aged_interest), 'per unit, from your recorded daily cost', b.aged_interest?'alert':'')}
        ${stat('Units 90+ days', fmt.num(b.units_90plus), 'the money eaters, named', b.units_90plus?'warn':'')}
        ${stat('Open leads', fmt.num(b.leads_open), 'speed to lead IS the business', b.leads_open?'bad':'')}
        ${stat('', '', '')}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}
        ${stat('This week, counted', `${b.recovered.leads_answered_in_hour} · ${b.recovered.units_sold} · ${b.recovered.deals_delivered}`,
               'leads answered <1h · units sold · deals delivered')}</div>`);
}

async function leads(){
  const d = await API.get('/api/leads');
  document.getElementById('v-leads').innerHTML =
    `<div class="banner warn">A lead is drafted for reply in minutes. A condition question is
      answered by the recorded report, cited by date — or refused when no report exists. Payment
      numbers only from recorded lender terms.</div>` +
    panel('Leads & messages', '', table([{label:'When'},{label:'From'},{label:'Message'},{label:'Label'},{label:''}],
      d.rows, m=>`<td>${fmt.stamp(m.at)}${m.demo_tag?' '+pill(m.demo_tag,'brand'):''}</td>
        <td>${esc(m.from||'')}</td><td>${esc(m.text)}</td>
        <td>${m.label?pill(m.label, m.label==='lead'?'good':m.label==='condition_ask'?'warn':''):'—'}</td>
        <td class="right"><button class="act primary" onclick="handle('${m.id}')">Handle</button></td>`), true) +
    `<div id="lout"></div>`;
}
async function handle(id){
  const r = await API.post(`/api/leads/${id}/handle`);
  document.getElementById('lout').innerHTML = (r.steps||[]).map(s=>`
    <div class="panel"><h2>${esc(s.action)}</h2><div class="body">
      ${s.draft?`<div class="strong" style="white-space:pre-wrap">${esc(s.draft)}</div>`:''}
      ${s.refused?`<div class="banner warn">${esc(s.refused)}</div>`:''}
      <div class="why">${esc(s.why||'')}</div></div></div>`).join('');
}

async function lot(){
  const d = await API.get('/api/units');
  document.getElementById('v-lot').innerHTML =
    `<div class="banner warn">Try it: deliver the deal with no title status — refused; the titled
      deal queues at R1.</div>
     <div style="margin:10px 0">
      <button class="act" onclick="deliver('dl_demo_notitle')">Deliver: no title status</button>
      <button class="act primary" onclick="deliver('dl_demo_titled')">Deliver: title in hand</button>
     </div><div id="dout"></div>` +
    panel('Aged inventory', 'floorplan counted from acquisition dates and your recorded rate', table(
      [{label:'Unit'},{label:'Days',num:true},{label:'Bucket'},{label:'Interest',num:true}],
      d.rows, u=>`<td>${esc(u.desc||u.unit)}</td>
        <td class="num">${u.days??blank(u._missing)}</td>
        <td>${u.bucket?pill(u.bucket, u.bucket==='90+'?'bad':u.bucket==='60+'?'warn':''):'—'}</td>
        <td class="num">${u.interest_accrued!=null?fmt.money(u.interest_accrued):esc(u.interest_note||'—')}</td>`), true);
}
async function deliver(id){
  const r = await API.post(`/api/deals/${id}/deliver`);
  document.getElementById('dout').innerHTML = r.refused
    ? panel('Refused', '', `<div class="banner warn">${esc(r.refused)}</div>`)
    : panel('Delivery', '', `<div class="strong">queued at R1</div>`);
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['aged_interest','Floorplan accruing','counted'],
    ['leads_mo','Leads/mo','your number'],['close_lift','Close lift from speed','your number (0–1)'],
    ['avg_gross','Avg front-end gross','your number'],
    ['desk_hours_wk','Desk hrs/wk','your number'],['desk_rate','Desk rate','your number'],
    ['compliance_value','The compliance file','yours or blank']];
  const rec=d.recorded||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') + renderEval(ev.triage) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'owner'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
