<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-inbox"></section>
  <section class="view" id="v-signals"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records. An account never enters test mode
from a message, a passcode in a thread is never accepted, and a fire dispatch is never cancelled
by this system — no exceptions exist.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'inbox',label:'Inbox'},{id:'signals',label:'Signals & gates'},
      {id:'roi',label:'What it\'s worth'},{id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,inbox,signals,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${fmt.num(d.config.accounts)} accounts · ${d.config.operators} operators`;
  document.getElementById('v-board').innerHTML =
    panel('The center, counted', '',
      `<div class="grid">
        ${stat('Fine exposure YTD', fmt.money(b.fine_exposure), 'counted against each city\'s recorded schedule', b.fine_exposure?'warn':'')}
        ${stat('Permit lapses', fmt.num(b.permit_lapses), 'every dispatch to an unpermitted address fines', b.permit_lapses?'alert':'')}
        ${stat('Unhandled messages', fmt.num(b.messages_open), 'the social-engineering reads come first', b.messages_open?'bad':'')}
        ${stat('', '', '')}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}
        ${stat('This week, counted', `${b.recovered.social_engineering_refused} · ${b.recovered.callbacks_verified} · ${b.recovered.permits_renewed}`,
               'SE attempts refused · callbacks verified · permits renewed')}</div>`);
}

async function inbox(){
  const d = await API.get('/api/messages');
  document.getElementById('v-inbox').innerHTML =
    `<div class="banner warn">"Put me in test mode" by text is <b>the burglar's first move</b> —
      refused, logged, and turned into a verified callback to the number ON FILE. A passcode in a
      thread is never read.</div>` +
    panel('Messages', '', table([{label:'When'},{label:'From'},{label:'Message'},{label:'Label'},{label:''}],
      d.rows, m=>`<td>${fmt.stamp(m.at)}${m.demo_tag?' '+pill(m.demo_tag,'brand'):''}</td>
        <td>${esc(m.from||'')}</td><td>${esc(m.text)}</td>
        <td>${m.label?pill(m.label, ['test_mode_request','passcode_in_text','fire_signal'].includes(m.label)?'bad':''):'—'}</td>
        <td class="right"><button class="act primary" onclick="handle('${m.id}')">Handle</button></td>`), true) +
    `<div id="mout"></div>`;
}
async function handle(id){
  const r = await API.post(`/api/messages/${id}/handle`);
  document.getElementById('mout').innerHTML = (r.steps||[]).map(s=>`
    <div class="panel"><h2>${esc(s.action)}</h2><div class="body">
      ${s.draft?`<div class="strong" style="white-space:pre-wrap">${esc(s.draft)}</div>`:''}
      ${s.refused?`<div class="banner warn">${esc(s.refused)}</div>`:''}
      <div class="why">${esc(s.why||'')}</div></div></div>`).join('');
}

async function signals(){
  const d = await API.get('/api/signals');
  document.getElementById('v-signals').innerHTML =
    `<div class="banner warn">Try it: cancel the fire dispatch — refused, no exceptions; cancel the
      burglary dispatch without a verified callback — refused; with one — a human's call.</div>
     <div style="margin:10px 0">
      <button class="act" onclick="cancel('sg_demo_fire',true)">Cancel FIRE dispatch</button>
      <button class="act" onclick="cancel('sg_demo_burg',false)">Cancel burglary: no callback</button>
      <button class="act primary" onclick="cancel('sg_demo_burg',true)">Cancel burglary: verified callback</button>
     </div><div id="sout"></div>` +
    panel('Live signals', '', table([{label:'Signal'},{label:'Kind'},{label:'Account'},{label:'When'}],
      d.rows, s=>`<td class="mono">${esc(s.id)}</td>
        <td>${pill(s.kind, s.kind==='fire'?'bad':'warn')}</td>
        <td class="mono">${esc(s.account_id||'')}</td><td>${fmt.stamp(s.at)}</td>`), true);
}
async function cancel(id, verified){
  const r = await API.post(`/api/signals/${id}/cancel`,{human:'operator-7',verified_callback:verified});
  document.getElementById('sout').innerHTML = r.refused
    ? panel('Refused', '', `<div class="banner warn">${esc(r.refused)}</div>`)
    : panel('Cancelled', '', `<div class="strong">${esc(r.why)}</div>`);
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['fine_exposure','Fine exposure YTD','counted'],['lapses','Permit lapses','counted'],
    ['avg_fine','Avg dispatch fine','your city'],
    ['operator_hours_wk','Operator hrs/wk','your number'],['operator_rate','Operator rate','your number'],
    ['callback_value','The refusal log','yours or blank']];
  const rec=d.recorded||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') + renderEval(ev.triage) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'owner'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
