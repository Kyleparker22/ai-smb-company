<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-inbox"></section>
  <section class="view" id="v-variance"></section>
  <section class="view" id="v-scorecard"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records. This system drafts nothing on an
illness or allergen claim, never answers an allergen question, never talks to the health
department, and never estimates variance where no counts were taken.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'inbox',label:'Inbox'},{id:'variance',label:'Variance'},
      {id:'scorecard',label:'Scorecard'},{id:'roi',label:'What it\'s worth'},{id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,inbox,variance,scorecard,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${d.config.units} units · ${d.config.revenue}`;
  document.getElementById('v-board').innerHTML =
    panel('The group, counted', '',
      `<div class="grid">
        ${stat('Units over variance threshold', fmt.num(b.flagged_units), '', b.flagged_units?'alert':'')}
        ${stat('Units unmeasured', fmt.num(b.unmeasured_units), 'no counts — no number, never estimated', b.unmeasured_units?'warn':'')}
        ${stat('Unhandled messages', fmt.num(b.messages_open), '')}
        ${stat('Dangerous messages seen', fmt.num(b.dangerous_seen), 'each escalated with no reply drafted')}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}
        ${stat('This week, counted', `${b.recovered.replies_sent} · ${b.recovered.dangerous_escalated} · ${b.recovered.briefs_opened}`,
               'replies sent · dangerous escalated · briefs opened — from the log')}</div>`);
}

async function inbox(){
  const d = await API.get('/api/messages');
  document.getElementById('v-inbox').innerHTML =
    `<div class="banner warn">An illness claim, an allergen incident, an allergen <i>question</i>,
      or health-department contact gets <b>no drafted reply at all</b> — a human, immediately.
      Routine complaints draft at R1.</div>` +
    panel('Messages', '', table([{label:'When'},{label:'Message'},{label:'Label'},{label:''}],
      d.rows, m=>`<td>${fmt.stamp(m.at)}${m.demo_tag?' '+pill(m.demo_tag,'brand'):''}</td>
        <td>${esc(m.text)}</td>
        <td>${m.label?pill(m.label, ['illness','allergen_incident','allergen_question','health_dept'].includes(m.label)?'bad':m.label==='complaint'?'warn':''):'—'}</td>
        <td class="right"><button class="act primary" onclick="handle('${m.id}')">Handle</button></td>`), true) +
    `<div id="mout"></div>`;
}
async function handle(id){
  const r = await API.post(`/api/messages/${id}/handle`);
  document.getElementById('mout').innerHTML = (r.steps||[]).map(s=>`
    <div class="panel"><h2>${esc(s.action)}${s.kind?' '+pill(s.kind,'bad'):''}</h2><div class="body">
      ${s.refused?`<div class="banner warn">${esc(s.refused)}</div>`:''}
      <div class="why">${esc(s.why||'')}</div></div></div>`).join('');
}

async function variance(){
  const d = await API.get('/api/variance');
  document.getElementById('v-variance').innerHTML =
    `<div class="banner">Variance computes <b>only where counts exist</b>. The unit that skipped
      counts reads unmeasured — last month's number is not this month's.</div>` +
    panel('Latest period per unit', `flag threshold ${d.threshold_pp}pp`, table(
      [{label:'Unit'},{label:'Period'},{label:'Variance (pp)',num:true},{label:'Dollars',num:true},{label:''}],
      d.rows, r=>`<td>${esc(r.unit)}</td><td class="mono">${esc(r.period||'—')}</td>
        <td class="num strong">${r.variance_pp!=null?r.variance_pp.toFixed(2):blank(r._missing)}</td>
        <td class="num">${r.dollars!=null?fmt.money(r.dollars):'—'}</td>
        <td>${r.flagged?pill('over threshold','bad'):r._missing?pill('unmeasured','warn'):pill('inside','good')}</td>`), true);
}

async function scorecard(){
  const d = await API.get('/api/scorecard');
  document.getElementById('v-scorecard').innerHTML =
    panel('Per-unit counted facts', 'every cell computes or refuses', table(
      [{label:'Unit'},{label:'Variance (pp)',num:true},{label:'Complaints (30d)',num:true},{label:'Response backlog',num:true}],
      d.rows, r=>`<td>${esc(r.unit)}</td>
        <td class="num">${r.variance_pp!=null?r.variance_pp.toFixed(2):blank(r.variance_missing)}</td>
        <td class="num">${r.complaints_30d}</td>
        <td class="num ${r.response_backlog?'strong':''}">${r.response_backlog}</td>`), true);
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['flagged_variance_dollars','Flagged variance $','counted'],
    ['recovery_share','Recovery share','your number (0–1)'],
    ['messages_wk','Messages / wk','your number'],['min_per_reply','Min per reply','your number'],
    ['manager_rate','Manager rate','your number'],
    ['claim_exposure','Clean-paper-trail worth','yours or blank']];
  const rec=d.recorded||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') + renderEval(ev.triage) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'owner'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
