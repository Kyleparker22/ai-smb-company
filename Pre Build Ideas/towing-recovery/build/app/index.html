<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hook OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-calls"></section>
  <section class="view" id="v-tows"></section>
  <section class="view" id="v-impounds"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records. No invoice can exceed the filed
rate card, storage runs on recorded stamps, damage answers come from the hookup photo set or not
at all, and the system never files a lien or sells a vehicle.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'calls',label:'Calls'},{id:'tows',label:'Tows & the clamp'},
      {id:'impounds',label:'Impound lot'},{id:'roi',label:'What it\'s worth'},{id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,calls,tows,impounds,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${d.config.trucks} trucks · ${d.config.revenue}`;
  document.getElementById('v-board').innerHTML =
    panel('The lot, counted', '',
      `<div class="grid">
        ${stat('Vehicles held', fmt.num(b.vehicles_held), 'storage running on recorded stamps')}
        ${stat('Storage accruing', fmt.money(b.held_storage_value), 'from the filed card, to the day')}
        ${stat('Unhandled calls', fmt.num(b.calls_open), 'rotation reads first', b.calls_open?'warn':'')}
        ${stat('Filed card', fmt.money(d.card.hookup), `hookup · $${d.card.per_mile}/mi · $${d.card.storage_per_day}/day`)}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}
        ${stat('This week, counted', `${fmt.money(b.recovered.storage_billed)}`,
               `${b.recovered.rotation_calls} rotation call(s) · ${b.recovered.vehicles_released} release(s)`)}</div>`);
}

async function calls(){
  const d = await API.get('/api/calls');
  document.getElementById('v-calls').innerHTML =
    `<div class="banner warn">A rotation call's clock starts at the record — it is handled at R2
      the moment it's read. Price questions are answered <b>from the filed card, never around
      it</b>.</div>` +
    panel('Calls', '', table([{label:'When'},{label:'From'},{label:'Call'},{label:'Label'},{label:''}],
      d.rows, m=>`<td>${fmt.stamp(m.at)}${m.demo_tag?' '+pill(m.demo_tag,'brand'):''}</td>
        <td>${esc(m.from||'')}</td><td>${esc(m.text)}</td>
        <td>${m.label?pill(m.label, m.label==='rotation'?'bad':''):'—'}</td>
        <td class="right"><button class="act primary" onclick="handle('${m.id}')">Handle</button></td>`), true) +
    `<div id="cout"></div>`;
}
async function handle(id){
  const r = await API.post(`/api/calls/${id}/handle`);
  document.getElementById('cout').innerHTML = (r.steps||[]).map(s=>`
    <div class="panel"><h2>${esc(s.action)}</h2><div class="body">
      ${s.draft?`<div class="strong" style="white-space:pre-wrap">${esc(s.draft)}</div>`:''}
      <div class="why">${esc(s.why||'')}</div></div></div>`).join('');
}

async function tows(){
  const d = await API.get('/api/tows');
  document.getElementById('v-tows').innerHTML =
    `<div class="banner warn">Try it: bill the tow where someone asked for $900 — clamped to the
      card; answer the damage dispute with one photo — refused.</div>
     <div style="margin:10px 0">
      <button class="act" onclick="bill('tw_demo_over')">Bill: $900 requested</button>
      <button class="act primary" onclick="bill('tw_demo_clean')">Bill: from the card</button>
      <button class="act" onclick="damage('tw_demo_nophotos')">Damage dispute: 1 photo</button>
      <button class="act" onclick="damage('tw_demo_clean')">Damage dispute: 5 photos</button>
     </div><div id="tout"></div>` +
    panel('Tows', '', table([{label:'Tow'},{label:'Customer'},{label:'Miles',num:true},{label:'Photos',num:true}],
      d.rows, t=>`<td class="mono">${esc(t.id)}${t.demo_tag?' '+pill(t.demo_tag,'brand'):''}</td>
        <td>${esc(t.customer||'')}</td><td class="num">${t.miles??'—'}</td>
        <td class="num">${t.hookup_photos??0}</td>`), true);
}
async function bill(id){
  const r = await API.post(`/api/tows/${id}/bill`);
  document.getElementById('tout').innerHTML = r.refused
    ? panel('Clamped', '', `<div class="banner warn">${esc(r.refused)}</div>` +
        (r.invoice?`<div class="why">the card's number: ${fmt.money(r.invoice.total)}</div>`:''))
    : panel('Invoice drafted', '', `<div class="strong">${fmt.money(r.invoice.total)} — ${esc(r.invoice.basis)}</div>`);
}
async function damage(id){
  const r = await API.post(`/api/tows/${id}/damage`);
  document.getElementById('tout').innerHTML = r.refused
    ? panel('Cannot assert', '', `<div class="banner warn">${esc(r.refused)}</div>`)
    : panel('Evidence ready', '', `<div class="strong">${r.photos} hookup photos — ${esc(r.note)}</div>`);
}

async function impounds(){
  const d = await API.get('/api/impounds');
  document.getElementById('v-impounds').innerHTML =
    panel('Impound lot', 'lien steps are DATE ALERTS — filing is counsel\'s, always', table(
      [{label:'Vehicle'},{label:'State'},{label:'Storage'},{label:'Next lien step'},{label:''}],
      d.rows, i=>`<td>${esc(i.vehicle||i.id)}${i.demo_tag?' '+pill(i.demo_tag,'brand'):''}</td>
        <td>${esc(i.state_code||'')}</td>
        <td>${i.storage&&i.storage.total?fmt.money(i.storage.total)+' ('+i.storage.days+'d)':blank(i.storage&&i.storage._missing)}</td>
        <td>${i.lien&&i.lien.steps&&i.lien.steps.length?esc(i.lien.steps[0].step)+' in '+i.lien.steps[0].days_left+'d':'—'}</td>
        <td>${i.released_at?pill('released','good'):pill('held','warn')}</td>`), true);
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['held_storage_value','Storage accruing','counted'],
    ['rotation_calls_mo','Rotation calls/mo','your number'],['avg_rotation_ticket','Avg rotation ticket','your number'],
    ['office_hours_wk','Office hrs/wk','your number'],['office_rate','Office rate','your number'],
    ['defense_value','The rate-card defense','yours or blank']];
  const rec=d.recorded||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') + renderEval(ev.triage) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'owner'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
