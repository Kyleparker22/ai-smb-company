<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-inbox"></section>
  <section class="view" id="v-dunning"></section>
  <section class="view" id="v-churn"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records. A cancellation request is processed,
never delayed by a save attempt; an injury report gets nothing in writing from software; dunning
never threatens; no health outcome is ever promised.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'inbox',label:'Inbox'},{id:'dunning',label:'Dunning'},
      {id:'churn',label:'Churn watch'},{id:'roi',label:'What it\'s worth'},{id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,inbox,dunning,churn,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${d.config.locations} locations · ${d.config.revenue}`;
  document.getElementById('v-board').innerHTML =
    panel('The membership, counted', '',
      `<div class="grid">
        ${stat('Members with failed payments', fmt.num(b.open_failures), 'a service problem, not a sales problem', b.open_failures?'alert':'')}
        ${stat('At churn risk', fmt.num(b.at_risk), `${b.single_signal} more show one signal only — a note, not a pattern`, b.at_risk?'warn':'')}
        ${stat('Involuntary churn share', val(b.churn_split,'involuntary_share',fmt.pct),
          b.churn_split._missing?'':`${b.churn_split.involuntary} of ${b.churn_split.of} cancellations`)}
        ${stat('Cancellations in the clock', fmt.num(b.cancel_queue), 'processed, never negotiated')}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}
        ${stat('This week, counted', `${fmt.money(b.recovered.recovered_value)}`,
               `${b.recovered.payments_recovered} payment(s) recovered · ${b.recovered.dunning_sent} dunning · ${b.recovered.winbacks_sent} winback(s) sent`)}</div>`);
}

async function inbox(){
  const d = await API.get('/api/messages');
  document.getElementById('v-inbox').innerHTML =
    `<div class="banner warn">A cancellation starts its statutory clock <b>at the request</b> — a
      retention offer is a separate row and processing never waits on it. An injury report gets
      nothing in writing from software.</div>` +
    panel('Messages', '', table([{label:'When'},{label:'Message'},{label:'Label'},{label:''}],
      d.rows, m=>`<td>${fmt.stamp(m.at)}${m.demo_tag?' '+pill(m.demo_tag,'brand'):''}</td>
        <td>${esc(m.text)}</td>
        <td>${m.label?pill(m.label, ['injury','cancellation'].includes(m.label)?'bad':m.label==='medical_question'?'warn':''):'—'}</td>
        <td class="right"><button class="act primary" onclick="handle('${m.id}')">Handle</button></td>`), true) +
    `<div id="mout"></div>`;
}
async function handle(id){
  const r = await API.post(`/api/messages/${id}/handle`);
  document.getElementById('mout').innerHTML = (r.steps||[]).map(s=>`
    <div class="panel"><h2>${esc(s.action)}${s.kind?' '+pill(s.kind,'bad'):''}</h2><div class="body">
      ${s.clock?`<div class="strong">Process by ${fmt.stamp(s.clock.process_by)} (${esc(s.clock.state)}, ${s.clock.days}d)</div>
        <div class="why">${esc(s.clock.note)} · ${esc(s.clock.rules_source)}</div>`:''}
      ${s.refused?`<div class="banner warn">${esc(s.refused)}</div>`:''}
      <div class="why">${esc(s.why||'')}</div></div></div>`).join('');
}

async function dunning(){
  const d = await API.get('/api/dunning');
  document.getElementById('v-dunning').innerHTML =
    `<div class="banner">The ladder is ${d.max_touches} touches, then a person. The template never
      threatens: “${esc(d.template)}”</div>` +
    panel('Members with open failures', '', table(
      [{label:'Member'},{label:'Touches',num:true},{label:'Next step'}],
      d.rows, r=>`<td>${esc(r.name)}</td><td class="num">${r.touches}/${d.max_touches}</td>
        <td>${pill(r.plan.action, r.plan.action==='draft'?'good':r.plan.action==='human'?'warn':'')}
          <div class="why">${esc(r.plan.why)}</div></td>`), true);
}

async function churn(){
  const d = await API.get('/api/churn');
  document.getElementById('v-churn').innerHTML =
    `<div class="banner">${esc(d.note)}</div>` +
    panel('At risk', `${d.n} with ${d.floor}+ signals · ${d.single_signal} with one only`, table(
      [{label:'Member'},{label:'Signals',num:true},{label:'What we can see'}], d.rows,
      r=>`<td>${esc(r.name)}</td><td class="num strong">${r.count}</td>
        <td><ul class="reasons">${(r.signals||[]).map(s=>`<li>${esc(s.detail)}</li>`).join('')}</ul></td>`), true);
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['open_failures','Members w/ failed payments','counted'],['recovery_rate','Recovery rate','your number (0–1)'],
    ['avg_dues','Avg monthly dues','counted (median)'],['at_risk','At-risk members','counted'],
    ['save_rate','Save rate','your number (0–1)'],
    ['chase_hours_wk','Billing chase hrs/wk','your number'],['staff_rate','Staff rate','your number'],
    ['cancel_exposure','Clean-record worth','yours or blank']];
  const rec=d.recorded||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') + renderEval(ev.triage) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'owner'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
