<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visit OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-inbox"></section>
  <section class="view" id="v-lapsed"></section>
  <section class="view" id="v-slots"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records. This system gives no clinical advice,
routes every emergency signal to a human immediately, never handles a quality-of-life conversation,
and can never contact a deceased or transferred patient.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'inbox',label:'Inbox'},{id:'lapsed',label:'Reactivation'},
      {id:'slots',label:'Backfill'},{id:'roi',label:'What it\'s worth'},{id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,inbox,lapsed,slots,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${d.config.dvms} DVMs · ${d.config.revenue}`;
  document.getElementById('v-board').innerHTML =
    panel('The practice, counted', '',
      `<div class="grid">
        ${stat('Lapsed active patients', fmt.num(b.lapsed), 'overdue on something, by their own chart', b.lapsed?'alert':'')}
        ${stat('Backfill rate (90d)', val(b.backfill,'backfill_rate',fmt.pct),
          b.backfill._missing?'':`${b.backfill.backfilled} of ${b.backfill.cancellations} cancellations`)}
        ${stat('Unhandled messages', fmt.num(b.messages_open), 'triage never queues an emergency', b.messages_open?'warn':'')}
        ${stat('Active patients', fmt.num(b.active_patients), 'the only ones reactivation can see')}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}
        ${stat('This week, counted', `${b.recovered.reminders_sent} · ${b.recovered.slots_backfilled} · ${b.recovered.patients_returned}`,
               'reminders sent · slots backfilled · patients returned — from the log, never asserted')}</div>`);
}

async function inbox(){
  const d = await API.get('/api/messages');
  document.getElementById('v-inbox').innerHTML =
    `<div class="banner warn">Any emergency signal routes to a human <b>immediately</b> with:
      “${esc(d.instruction)}” Clinical questions route to a DVM <b>unanswered</b>. Quality-of-life
      conversations are never handled by software.</div>` +
    panel('Messages', '', table([{label:'When'},{label:'Message'},{label:'Label'},{label:''}],
      d.rows, m=>`<td>${fmt.stamp(m.at)}</td><td>${esc(m.text)}</td>
        <td>${m.label?pill(m.label, m.label==='emergency'?'bad':m.label==='clinical'||m.label==='qol'?'warn':''):'—'}</td>
        <td class="right"><button class="act primary" onclick="handle('${m.id}')">Handle</button></td>`), true) +
    `<div id="mout"></div>`;
}
async function handle(id){
  const r = await API.post(`/api/messages/${id}/handle`);
  document.getElementById('mout').innerHTML = (r.steps||[]).map(s=>`
    <div class="panel"><h2>${esc(s.action)}${s.kind?' '+pill(s.kind,'bad'):''}</h2><div class="body">
      ${s.said?`<div class="strong">“${esc(s.said)}”</div>`:''}
      ${s.refused?`<div class="banner warn" style="margin-top:10px">${esc(s.refused)}</div>`:''}
      <div class="why">${esc(s.why||'')}</div></div></div>`).join('');
}

async function lapsed(){
  const d = await API.get('/api/lapsed');
  document.getElementById('v-lapsed').innerHTML =
    `<div class="banner">Only <b>active</b> patients exist to this list. A deceased or transferred
      patient cannot be drafted a reminder — structurally, and re-checked at send time.</div>` +
    panel('Overdue, deepest first', '', table(
      [{label:'Patient'},{label:'Species'},{label:'Overdue on'},{label:'Days',num:true},{label:'Touches',num:true}],
      d.rows, r=>`<td>${esc(r.name)}</td><td>${esc(r.species)}</td>
        <td>${(r.due||[]).map(x=>pill(x.item,'warn')).join(' ')}</td>
        <td class="num strong">${r.max_overdue}</td><td class="num">${r.reminders}/3</td>`), true);
}

async function slots(){
  const d = await API.get('/api/slots');
  document.getElementById('v-slots').innerHTML =
    panel('Upcoming slots', 'cancel one to see the waitlist rank', table(
      [{label:'When'},{label:'Doctor'},{label:'Min',num:true},{label:''}],
      d.rows, s=>`<td>${fmt.stamp(s.when)}${s.demo_tag?' '+pill(s.demo_tag,'brand'):''}</td>
        <td>${esc(s.doctor)}</td><td class="num">${s.minutes}</td>
        <td class="right"><button class="act" onclick="cancelSlot('${s.id}')">Simulate cancellation</button></td>`), true) +
    `<div id="sout"></div>`;
}
async function cancelSlot(id){
  const r = await API.post(`/api/slots/${id}/cancel`);
  document.getElementById('sout').innerHTML =
    panel('Waitlist, ranked', 'offers draft at R1 — a human sends', table(
      [{label:'Who'},{label:'Score',num:true},{label:'Why'}], r.candidates,
      c=>`<td>${esc(c.who)} <span class="why">${esc(c.species)}</span></td>
        <td class="num strong">${c.score}</td>
        <td><ul class="reasons">${(c.reasons||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></td>`), true) +
    panel('Not offered', 'the blocker is named', table([{label:'Who'},{label:'Why'}], r.blocked,
      b=>`<td>${esc(b.who||'')}</td><td class="why">${esc(b.why)}</td>`), true);
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['lapsed_count','Lapsed patients','counted'],['show_rate','Show rate','your number (0–1)'],
    ['avg_visit','Avg visit value','counted (median)'],['cancellations_90d','Cancellations (90d)','counted'],
    ['backfill_lift','Backfill lift','your number (0–1)'],
    ['phone_hours_wk','Phone/reminder hrs/wk','your number'],['staff_rate','Staff rate','your number'],
    ['emergency_value','After-hours routing worth','yours or blank — we never monetize safety']];
  const rec=d.recorded||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') + renderEval(ev.triage) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'manager'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
