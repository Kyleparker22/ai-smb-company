<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bay OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-declined"></section>
  <section class="view" id="v-calls"></section>
  <section class="view" id="v-comebacks"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records. This system never tells a customer a
vehicle is safe, never sends a safety finding as a text, never quotes a firm price on an uninspected
car, and never diagnoses by phone.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'declined',label:'Declined work'},{id:'calls',label:'Intake'},
      {id:'comebacks',label:'Comebacks'},{id:'roi',label:'What it\'s worth'},
      {id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,declined,calls,comebacks,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${d.config.bays} bays · ${d.config.revenue}`;
  document.getElementById('v-board').innerHTML =
    panel('Money already found', 'counted from your own inspection sheets',
      `<div class="grid">
        ${stat('Open declined work', fmt.money(b.declined.value), `${b.declined.count} items`, b.declined.count?'alert':'')}
        ${stat('Safety items unrecovered', fmt.num(b.safety_open), 'each is a call task, never a text', b.safety_open?'warn':'')}
        ${stat('Comeback rate (180d)', val(b.comebacks,'rate',fmt.pct),
          b.comebacks._missing?'':`${b.comebacks.comebacks} of ${b.comebacks.of} ROs`)}
        ${stat('Unhandled calls', fmt.num(b.calls_open), '')}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}
        ${stat('Recovered this week', fmt.money(b.recovered.value_won),
               `${b.recovered.items_won} item(s) won · ${b.recovered.reoffers_sent} re-offer(s) sent — counted`)}</div>`);
}

async function declined(){
  const d = await API.get('/api/declined');
  document.getElementById('v-declined').innerHTML =
    `<div class="banner warn">${esc(d.rule)}.</div>` +
    panel('Declined items', `${fmt.money(d.value.value)} open`, table(
      [{label:'Finding'},{label:'Class'},{label:'Value',num:true},{label:'Declined'},{label:''}],
      d.rows, r=>`<td>${esc(r.text)}${r.demo_tag?' '+pill(r.demo_tag,'brand'):''}</td>
        <td>${pill(r.label||'unclassified', r.label==='safety_critical'?'bad':r.label==='deferrable'?'warn':'')}
          <div class="why">${esc(r.why||'')}</div></td>
        <td class="num">${fmt.money(r.value)}</td><td>${fmt.date(r.declined_at)}</td>
        <td class="right"><button class="act" onclick="tryText('${r.id}')">Text re-offer</button></td>`), true);
}
async function tryText(id){
  const r = await API.post(`/api/declined/${id}/text`);
  alert(r.refused ? `Refused: ${r.refused}` : (r.approval ? 'Draft queued for a human to send.' : JSON.stringify(r)));
}

async function calls(){
  const d = await API.get('/api/calls');
  document.getElementById('v-calls').innerHTML =
    `<div class="banner">Nothing is diagnosed by phone. A safety call gets a human immediately;
      a "what's wrong with it" gets an inspection booked, never a guess.</div>
     <div style="margin:10px 0">
      <button class="act primary" onclick="askPrice('brake_job')">Ask the price of a brake job</button>
      <button class="act" onclick="askPrice('head_gasket')">Ask about a job we rarely do</button>
     </div>` +
    panel('Inbound', '', table([{label:'When'},{label:'Transcript'},{label:'Routed'},{label:''}],
      d.rows, c=>`<td>${fmt.stamp(c.at)}</td><td>${esc(c.transcript)}</td>
        <td>${c.label?pill(c.label, c.label==='safety_priority'?'bad':c.label==='no_phone_diagnosis'?'warn':''):'—'}</td>
        <td class="right"><button class="act" onclick="classifyCall('${c.id}')">Classify</button></td>`), true) +
    `<div id="cout"></div>`;
}
async function askPrice(kind){
  const r = await API.get(`/api/quote/${kind}`);
  document.getElementById('cout').innerHTML =
    panel('The price answer', 'a band from our own ROs — a firm number never leaves software',
      `<div class="strong">${esc(r.say)}</div>
       <div class="why">${r.band?`middle half of ${r.n} closed ROs`:esc(r.why)} · firm-price refusal logged</div>`);
}
async function classifyCall(id){
  const r = await API.post(`/api/calls/${id}/classify`);
  document.getElementById('cout').innerHTML =
    panel('Routing', '', `<div class="strong">${esc(r.label)}</div><div class="why">${esc(r.why)}</div>`);
}

async function comebacks(){
  const d = await API.get('/api/comebacks');
  document.getElementById('v-comebacks').innerHTML =
    d._missing
    ? panel('Comebacks', '', `<div class="muted">${blank(d._missing)}</div>`)
    : panel('Comebacks (180 days)', `${fmt.pct(d.rate)} — ${esc(d.note)}`, table(
        [{label:'RO'},{label:'Vehicle'},{label:'System'},{label:'Days after prior',num:true}],
        d.rows, r=>`<td class="mono">${esc(r.ro)}</td><td class="mono">${esc(r.vehicle)}</td>
          <td>${esc(r.system)}</td><td class="num">${r.days_after}</td>`), true);
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['open_declined_value','Open declined value','counted'],
    ['reoffer_close_rate','Re-offer close rate','your number (0–1)'],
    ['aging_estimates','Estimates presented & aging','counted'],['avg_ro','Avg RO','counted (median)'],
    ['nudge_lift','Nudge lift','your number (0–1)'],
    ['followup_hours_wk','Follow-up hrs/wk','your number'],['advisor_rate','Advisor rate','your number'],
    ['comebacks_180d','Comebacks (180d)','counted']];
  const rec=d.recorded||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') + renderEval(ev.items) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'owner'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
