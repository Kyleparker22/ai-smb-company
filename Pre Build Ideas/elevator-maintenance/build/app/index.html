<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cab OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-calls"></section>
  <section class="view" id="v-units"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records. The desk script never allows
self-evacuation, a red-tagged unit returns only on the clearing mechanic's recorded sign-off, a
test with no record reads UNKNOWN, and nothing is billable off contract silence.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'calls',label:'Calls'},{id:'units',label:'Units & gates'},
      {id:'roi',label:'What it\'s worth'},{id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,calls,units,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${d.config.mechanics} mechanics · ${d.config.revenue}`;
  document.getElementById('v-board').innerHTML =
    panel('The fleet, counted', '',
      `<div class="grid">
        ${stat('Units', fmt.num(b.units), `${b.red_tagged} red-tagged`, b.red_tagged?'bad':'')}
        ${stat('Tests overdue', fmt.num(b.tests_overdue), 'each is revenue AND exposure', b.tests_overdue?'alert':'')}
        ${stat('Tests UNKNOWN', fmt.num(b.tests_unknown), 'no record — never shown compliant', b.tests_unknown?'warn':'')}
        ${stat('Callback rate', val(b.callbacks,'rate',fmt.pct), b.callbacks._missing?'':`${b.callbacks.callbacks} of ${b.callbacks.of}`)}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}
        ${stat('This week, counted', `${b.recovered.entrapments_dispatched} · ${b.recovered.tests_recorded} · ${b.recovered.billables_sent}`,
               'entrapments dispatched · tests recorded · billables sent')}</div>`);
}

async function calls(){
  const d = await API.get('/api/calls');
  document.getElementById('v-calls').innerHTML =
    `<div class="banner warn">An entrapment dispatches NOW with the verbatim script — <b>never
      advise self-evacuation</b>; climbing out of a stalled car is the fatality mechanism, not
      waiting in it.</div>` +
    panel('Calls', '', table([{label:'When'},{label:'From'},{label:'Call'},{label:'Label'},{label:''}],
      d.rows, m=>`<td>${fmt.stamp(m.at)}${m.demo_tag?' '+pill(m.demo_tag,'brand'):''}</td>
        <td>${esc(m.from||'')}</td><td>${esc(m.text)}</td>
        <td>${m.label?pill(m.label, m.label==='entrapment'?'bad':m.label==='unit_down'?'warn':''):'—'}</td>
        <td class="right"><button class="act primary" onclick="handle('${m.id}')">Handle</button></td>`), true) +
    `<div id="cout"></div>`;
}
async function handle(id){
  const r = await API.post(`/api/calls/${id}/handle`);
  document.getElementById('cout').innerHTML = (r.steps||[]).map(s=>`
    <div class="panel"><h2>${esc(s.action)}</h2><div class="body">
      ${s.said?`<div class="strong">${esc(s.said)}</div>`:''}
      <div class="why">${esc(s.why||'')}</div></div></div>`).join('');
}

async function units(){
  const d = await API.get('/api/units');
  document.getElementById('v-units').innerHTML =
    `<div class="banner warn">Try it: reactivate the red-tagged unit without a sign-off — refused;
      scope the vandalism ticket — billable with the clause cited; scope something the contract is
      silent on — ambiguous, never billable.</div>
     <div style="margin:10px 0">
      <button class="act" onclick="react('un_demo_red',null)">Reactivate: no sign-off</button>
      <button class="act primary" onclick="react('un_demo_red','MECH-armando-2214')">Reactivate: mechanic sign-off</button>
      <button class="act" onclick="scope('un_000','kicked-in panel, vandalism at the lobby')">Scope: vandalism</button>
      <button class="act" onclick="scope('un_000','water damage from the roof leak')">Scope: contract silent</button>
     </div><div id="uout"></div>` +
    panel('Units', '', table([{label:'Unit'},{label:'Building'},{label:'cat1'},{label:'cat5'},{label:''}],
      d.rows, u=>`<td class="mono">${esc(u.unit)}</td><td>${esc(u.building||'')}</td>
        <td>${pill(u.tests.cat1.state, u.tests.cat1.state==='overdue'?'bad':u.tests.cat1.state==='unknown'?'warn':u.tests.cat1.state==='current'?'good':'warn')}</td>
        <td>${pill(u.tests.cat5.state, u.tests.cat5.state==='overdue'?'bad':u.tests.cat5.state==='unknown'?'warn':u.tests.cat5.state==='current'?'good':'warn')}</td>
        <td>${u.red_tagged?pill('RED TAGGED','bad'):''}</td>`), true);
}
async function react(id, signoff){
  const r = await API.post(`/api/units/${id}/reactivate`, signoff?{mechanic_signoff:signoff}:{});
  document.getElementById('uout').innerHTML = r.refused
    ? panel('Refused', '', `<div class="banner warn">${esc(r.refused)}</div>`)
    : panel('Cleared', '', `<div class="strong">${esc(r.why)}</div>`);
}
async function scope(id, work){
  const r = await API.post(`/api/units/${id}/scope`,{work});
  document.getElementById('uout').innerHTML =
    panel('Scope: '+r.verdict, '', `<div class="strong">${esc(r.why)}</div>` +
      (r.draft?`<div class="why" style="white-space:pre-wrap">${esc(r.draft)}</div>`:''));
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['tests_due','Tests due/overdue/unknown','counted'],['avg_test_fee','Avg test fee','your number'],
    ['billable_findings','Billable findings/mo','your number'],['avg_ticket','Avg billable ticket','your number'],
    ['office_hours_wk','Office hrs/wk','your number'],['office_rate','Office rate','your number'],
    ['entrapment_value','The entrapment log','yours or blank']];
  const rec=d.recorded||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') + renderEval(ev.triage) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'owner'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
