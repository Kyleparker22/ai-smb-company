<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Available homes</title>
<link rel="stylesheet" href="/shared.css">
</head>
<body>

<div class="bar"><div class="bar-in">
  <div class="logo"><span class="mark">◈</span><span id="orgName">Available homes</span></div>
  <div class="grow"></div>
  <button class="btn ghost sm" onclick="toggleTheme()" aria-label="Toggle theme">◐</button>
</div></div>

<main class="wrap" id="main" style="max-width:680px">
  <div class="empty"><div class="big">◈</div>Loading…</div>
</main>

<script src="/app.js"></script>
<script>
let L = [], PICK = null;

async function boot() {
  L = await API.get('/listings');
  render();
}

function render() {
  $('#main').innerHTML = `
  <div style="padding:24px 0 16px">
    <h1>Available homes</h1>
    <div class="muted small">Inquiries are handled strictly in the order they arrive —
      everyone gets the same process, in the same order.</div>
  </div>

  ${L.length ? `<div class="stack" style="gap:10px;margin-bottom:18px">
    ${L.map(u => `
      <div class="card" style="cursor:pointer;${PICK === u.unit_id ? 'border-color:var(--brand)' : ''}"
           onclick="pick('${esc(u.unit_id)}')">
        <div class="card-b tight spread wrap-r" style="gap:9px">
          <div class="stack">
            <strong style="font-size:14.5px">${esc(u.property || '')} · ${esc(u.label)}</strong>
            <span class="small muted">${esc(u.beds)} bd · ${esc(u.baths)} ba · ${esc(u.sqft)} sq ft · ${esc(u.city || '')}</span>
          </div>
          <div class="row" style="gap:8px">
            <strong class="num">${esc(money(u.rent))}/mo</strong>
            ${PICK === u.unit_id ? '<span class="pill brand">selected</span>' : ''}
          </div>
        </div>
      </div>`).join('')}
  </div>` : `<div class="card" style="margin-bottom:18px"><div class="empty">
    <div class="big">◈</div>Nothing is listed right now — leave your details below and
    we'll keep your inquiry on file, in order.</div></div>`}

  <div class="card"><div class="card-h"><h2>Ask about a home</h2></div>
    <div class="card-b stack" style="gap:11px">
      <input class="in" id="fName" placeholder="Your name" autocomplete="name">
      <input class="in" id="fContact" placeholder="Email or phone" autocomplete="email">
      <input class="in" id="fMoveIn" placeholder="When do you want to move in? (optional)">
      <textarea class="in" id="fMsg" rows="3" placeholder="Anything you want to ask (optional)"></textarea>
      <button class="btn primary" onclick="submitInq()">Send inquiry</button>
      <div class="missing">Your inquiry joins a queue worked strictly in the order received.
        Nothing about you is scored or ranked — your place in line is set by when you asked,
        and by nothing else.</div>
    </div></div>`;
}

function pick(id) { PICK = PICK === id ? null : id; render(); }

async function submitInq() {
  const body = {
    name: $('#fName').value, contact: $('#fContact').value,
    move_in: $('#fMoveIn').value, message: $('#fMsg').value, unit_id: PICK,
  };
  try {
    const res = await API.post('/inquiries', body);
    $('#main').innerHTML = `<div style="padding:40px 0" class="stack" style="gap:12px">
      <div class="card"><div class="card-b" style="text-align:center;padding:34px 20px">
        <div style="font-size:40px;margin-bottom:10px">✓</div>
        <h2 style="margin-bottom:9px">${res.already_recorded ? "You're already in line" : "You're in line"}</h2>
        <div class="small muted" style="max-width:420px;margin:0 auto">
          ${esc(res.note || 'Inquiries are handled strictly in the order received. A person will contact you to schedule a tour.')}
        </div>
      </div></div></div>`;
  } catch (e) { toast(e.message); }
}

boot();
</script>
</body>
</html>
