<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pump OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-inbox"></section>
  <section class="view" id="v-jobs"></section>
  <section class="view" id="v-due"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records. Software never diagnoses a system
by phone, never bills a load without its manifest, and never schedules land application without a
recorded permit. Backups are emergencies, not bookings.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'inbox',label:'Inbox'},{id:'jobs',label:'Jobs & manifests'},
      {id:'due',label:'Due systems'},{id:'roi',label:'What it\'s worth'},{id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,inbox,jobs,due,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${d.config.pump_trucks} trucks · ${d.config.portable_units} units · ${d.config.revenue}`;
  document.getElementById('v-board').innerHTML =
    panel('The book, counted', '',
      `<div class="grid">
        ${stat('Systems overdue', fmt.num(b.due_systems), `${b.unknowable} unknowable (no record — said, not guessed)`, b.due_systems?'alert':'')}
        ${stat('Done, unbilled', fmt.num(b.unbilled_done), 'work done, invoice missing', b.unbilled_done?'warn':'')}
        ${stat('Backup emergencies', fmt.num(b.emergencies), 'human-handled, minutes matter', b.emergencies?'bad':'')}
        ${stat('Unhandled messages', fmt.num(b.messages_open), '')}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}
        ${stat('This week, counted', `${fmt.money(b.recovered.billed_value)}`,
               `${b.recovered.jobs_billed} billed · ${b.recovered.recalls_sent} recall(s) · ${b.recovered.portable_orders} order(s)`)}</div>`);
}

async function inbox(){
  const d = await API.get('/api/messages');
  document.getElementById('v-inbox').innerHTML =
    `<div class="banner warn">A backup is an emergency, not a booking. "Is it the baffle?" gets a
      tech visit — <b>a system nobody has opened is a system nobody diagnoses.</b></div>` +
    panel('Messages', '', table([{label:'When'},{label:'From'},{label:'Message'},{label:'Label'},{label:''}],
      d.rows, m=>`<td>${fmt.stamp(m.at)}${m.demo_tag?' '+pill(m.demo_tag,'brand'):''}</td>
        <td>${esc(m.from||'')}</td><td>${esc(m.text)}</td>
        <td>${m.label?pill(m.label, m.label==='emergency'?'bad':m.label==='diagnosis_ask'?'warn':''):'—'}</td>
        <td class="right"><button class="act primary" onclick="handle('${m.id}')">Handle</button></td>`), true) +
    `<div id="mout"></div>`;
}
async function handle(id){
  const r = await API.post(`/api/messages/${id}/handle`);
  document.getElementById('mout').innerHTML = (r.steps||[]).map(s=>`
    <div class="panel"><h2>${esc(s.action)}</h2><div class="body">
      ${s.said?`<div class="strong">${esc(s.said)}</div>`:''}
      ${s.draft?`<div class="strong" style="white-space:pre-wrap">${esc(s.draft)}</div>`:''}
      ${s.refused?`<div class="banner warn">${esc(s.refused)}</div>`:''}
      <div class="why">${esc(s.why||'')}</div></div></div>`).join('');
}

async function jobs(){
  const d = await API.get('/api/jobs');
  document.getElementById('v-jobs').innerHTML =
    `<div class="banner warn">Try it: bill the load with no manifest — refused; the unpermitted
      land application — refused; the complete record queues at R1.</div>
     <div style="margin:10px 0">
      <button class="act" onclick="bill('jb_demo_nomanifest')">Bill: no manifest</button>
      <button class="act" onclick="bill('jb_demo_landapp')">Bill: unpermitted land app</button>
      <button class="act primary" onclick="bill('jb_demo_manifest')">Bill: complete record</button>
     </div><div id="jout"></div>` +
    panel('Completed jobs', '', table(
      [{label:'Job'},{label:'Customer'},{label:'Gallons'},{label:'Site'},{label:'Manifest'},{label:'Billed'}],
      d.rows, j=>`<td class="mono">${esc(j.id)}${j.demo_tag?' '+pill(j.demo_tag,'brand'):''}</td>
        <td>${esc(j.customer_name||'')}</td>
        <td>${j.disposal&&j.disposal.gallons?j.disposal.gallons:pill('missing','bad')}</td>
        <td>${j.disposal?esc(j.disposal.disposal_site||'—'):'—'}</td>
        <td>${j.disposal&&j.disposal.manifest_ref?pill(j.disposal.manifest_ref,'good'):pill('NONE','bad')}</td>
        <td>${j.billed_at?pill('billed','good'):pill('open','warn')}</td>`), true);
}
async function bill(id){
  const r = await API.post(`/api/jobs/${id}/bill`);
  document.getElementById('jout').innerHTML = r.refused
    ? panel('Refused', '', `<div class="banner warn">${esc(r.refused)}</div>`)
    : panel('Invoice drafted', '', `<div class="strong">queued at R1</div>`);
}

async function due(){
  const d = await API.get('/api/due');
  document.getElementById('v-due').innerHTML =
    panel('Due systems', 'from each system\'s own recorded interval — no record reads unknowable, never assumed', table(
      [{label:'Customer'},{label:'Overdue',num:true},{label:'Recalls'}],
      d.rows, r=>`<td>${esc(r.customer||'')}</td>
        <td class="num">${r.overdue_days!=null?r.overdue_days+'d':blank(r._missing)}</td>
        <td>${r.recalls!=null?`${r.recalls} of 3`:'—'}</td>`), true);
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['overdue_systems','Systems overdue','counted'],['avg_ticket','Avg pump-out ticket','your number'],
    ['portable_orders_mo','Portable orders/mo','your number'],['avg_order','Avg event order','your number'],
    ['office_hours_wk','Office hrs/wk','your number'],['office_rate','Office rate','your number'],
    ['audit_value','A clean DEQ audit','yours or blank']];
  const rec=d.recorded||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') + renderEval(ev.triage) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'owner'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
