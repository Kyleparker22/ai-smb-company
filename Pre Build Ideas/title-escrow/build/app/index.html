<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closing OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-inbox"></section>
  <section class="view" id="v-files"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records. This system never sends, changes,
confirms, or restates wire instructions in any channel; never declares clear-to-close over an open
curative item; and never promises a closing date.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'inbox',label:'Inbox'},{id:'files',label:'Files & curatives'},
      {id:'roi',label:'What it\'s worth'},{id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,inbox,files,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${d.config.officers} escrow officers · ${d.config.revenue}`;
  document.getElementById('v-board').innerHTML =
    panel('The desk, counted', '',
      `<div class="grid">
        ${stat('Open files', fmt.num(b.open_files), `${b.ready} with every curative in`)}
        ${stat('Wire signals caught', fmt.num(b.wire_signals_seen), 'each shown the callback protocol', b.wire_signals_seen?'warn':'')}
        ${stat('Unhandled messages', fmt.num(b.messages_open), '')}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}
        ${stat('This week, counted', `${b.recovered.curatives_received} · ${b.recovered.files_closed} · ${b.recovered.wire_signals_caught}`,
               'curatives in · files closed · wire signals caught — from the log')}</div>`) +
    panel('Closest to closing', '', table(
      [{label:'File'},{label:'Address'},{label:'Days to close',num:true},{label:'Still open'}],
      b.files_top, r=>`<td class="mono">${esc(r.file)}</td><td>${esc(r.address||'')}</td>
        <td class="num">${r.days_to_close??'—'}</td>
        <td>${r.ready?pill('all items in','good'):(r.open_items||[]).map(k=>pill(k,'warn')).join(' ')}</td>`), true);
}

async function inbox(){
  const d = await API.get('/api/messages');
  document.getElementById('v-inbox').innerHTML =
    `<div class="banner warn">Anything touching wire instructions is read as a <b>fraud signal
      first</b>. The protocol: call the known number on file — never the number in the message —
      and never reply with instructions.</div>` +
    panel('Messages', '', table([{label:'When'},{label:'Message'},{label:'Label'},{label:''}],
      d.rows, m=>`<td>${fmt.stamp(m.at)}${m.demo_tag?' '+pill(m.demo_tag,'brand'):''}</td>
        <td>${esc(m.text)}</td>
        <td>${m.label?pill(m.label, m.label==='wire_signal'?'bad':''):'—'}</td>
        <td class="right"><button class="act primary" onclick="handle('${m.id}')">Handle</button></td>`), true) +
    `<div id="mout"></div>`;
}
async function handle(id){
  const r = await API.post(`/api/messages/${id}/handle`);
  document.getElementById('mout').innerHTML = (r.steps||[]).map(s=>`
    <div class="panel"><h2>${esc(s.action)}</h2><div class="body">
      ${s.said?`<div class="banner warn"><b>${esc(s.said)}</b></div>`:''}
      ${s.draft?`<div class="strong">“${esc(s.draft)}”</div>`:''}
      <div class="why">${esc(s.why||'')}</div></div></div>`).join('');
}

async function files(){
  const d = await API.get('/api/files');
  document.getElementById('v-files').innerHTML =
    `<div class="banner">Try <b>Clear to close</b> on both demo files — refused over the open
      payoff, drafted at R1 on the clean one. And ask either for wire instructions.</div>` +
    `<div style="margin:10px 0">
      <button class="act" onclick="clearFile('fl_demo_open')">Clear-to-close: 982 Dove Hollow (open payoff)</button>
      <button class="act primary" onclick="clearFile('fl_demo_clean')">Clear-to-close: 417 Juniper (clean)</button>
      <button class="act" onclick="wire('fl_demo_clean')">Ask the system for wire instructions</button>
     </div><div id="fout"></div>` +
    panel('Open files', '', table(
      [{label:'File'},{label:'Address'},{label:'Days',num:true},{label:'Open items'}],
      d.rows.slice(0,30), r=>`<td class="mono">${esc(r.file)}</td><td>${esc(r.address||'')}</td>
        <td class="num">${r.days_to_close??'—'}</td>
        <td>${r.ready?pill('ready','good'):(r.open_items||[]).map(k=>pill(k,'warn')).join(' ')}</td>`), true);
}
async function clearFile(id){
  const r = await API.post(`/api/files/${id}/clear`);
  document.getElementById('fout').innerHTML = r.refused
    ? panel('Refused', '', `<div class="banner warn">${esc(r.refused)}</div>`)
    : panel('Ready', r.note||'', `<div class="strong">${(r.received||[]).map(x=>pill(x.kind,'good')).join(' ')}</div>`);
}
async function wire(id){
  const r = await API.post(`/api/files/${id}/wire`);
  document.getElementById('fout').innerHTML =
    panel('Wire instructions request', '', r.refused
      ? `<div class="banner warn">Refused: ${esc(r.reason)}</div>`
      : JSON.stringify(r));
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['open_files','Open files','counted'],['hours_per_file','Status/chase hrs per file','your number'],
    ['processor_rate','Processor rate','your number'],['extra_files_mo','Extra files/mo capacity','your estimate'],
    ['avg_fee','Avg fee per file','your number'],['days_saved','Curative days shortened','your estimate'],
    ['carry_cost_day','Carry cost per day','your number'],
    ['wire_exposure','The wire stop worth','yours or blank']];
  const rec=d.recorded||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') + renderEval(ev.triage) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'escrow_officer'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
