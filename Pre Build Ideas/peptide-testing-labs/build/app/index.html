<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assay OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-queue"></section>
  <section class="view" id="v-coas"></section>
  <section class="view" id="v-verify"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records. This system never edits an analytical
value, never releases a certificate without a named human, and never states whether a substance is
safe to use. A correction supersedes — it does not overwrite.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'queue',label:'In flight'},{id:'coas',label:'Certificates'},
      {id:'verify',label:'Public lookup'},{id:'roi',label:'What it\'s worth'},{id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,queue,coas,verify,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${d.config.kind} · ${d.config.staff}`;
  document.getElementById('v-board').innerHTML =
    panel('The bench, counted', '',
      `<div class="grid">
        ${stat('Samples in flight', fmt.num(b.in_flight), 'received, not yet certified', b.in_flight?'warn':'')}
        ${stat('Median turnaround', val(b.turnaround,'median_hours',h=>h+' h'),
          b.turnaround._missing?'':`${b.turnaround.n} certificates · slowest ${b.turnaround.slowest_hours} h`)}
        ${stat('Certificates released', fmt.num(b.released), 'each one hashed and lookup-able')}
        ${stat('Superseded', fmt.num(b.superseded), 'retained, never deleted')}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'release never leaves the R1 floor')}
        ${stat('Public verifications', fmt.num(b.lookups), 'strangers checking a certificate')}</div>`) +
    panel('Oldest on the bench','age is measured from the sample log, not from when someone noticed',
      table([{label:'Sample'},{label:'Client'},{label:'Analyte'},{label:'Stage'},{label:'Age'}],
        b.oldest, r=>`<td>${esc(r.sample)}</td><td>${esc(r.client||'')}</td><td>${esc(r.analyte||'')}</td>
          <td>${pill(r.stage, r.stage==='awaiting release'?'warn':'')}</td>
          <td>${r.age_hours==null?blank('no received timestamp'):Math.round(r.age_hours)+' h'}</td>`, true));
}

async function queue(){
  const d = await API.get('/api/queue');
  document.getElementById('v-queue').innerHTML =
    panel('Everything not yet certified','',
      table([{label:'Sample'},{label:'Client'},{label:'Lot'},{label:'Analyte'},{label:'Stage'},{label:'Custody'},{label:''}],
        d.rows, r=>`<td>${esc(r.sample)}</td><td>${esc(r.client||'')}</td><td>${esc(r.lot||'')}</td>
          <td>${esc(r.analyte||'')}</td><td>${pill(r.stage)}</td>
          <td>${r.custody_steps}/4</td>
          <td class="right"><button class="act" onclick="draft('${r.sample}')">Draft certificate</button></td>`, true)) +
    `<div id="qout"></div>`;
}
async function draft(id){
  const g = await API.post(`/api/samples/${id}/grade`);
  const r = await API.post(`/api/samples/${id}/draft`);
  document.getElementById('qout').innerHTML = panel('What happened','',
    r.refused
      ? `<div class="banner bad"><b>Refused — ${esc(r.refused)}.</b> ${esc(r.why||'')}
         ${r.missing?`<br>Missing custody steps: ${r.missing.map(esc).join(', ')}`:''}</div>`
      : `<div class="banner">Graded <b>${esc(g.grade)}</b> — ${(g.reasons||[]).map(esc).join('; ')}.
         <br>A draft certificate exists. ${esc(r.why||'')} It has <b>no lookup token</b> until a
         human releases it, so a leaked draft cannot pose as an issued certificate.</div>`);
}

async function coas(){
  const d = await API.get('/api/coas');
  document.getElementById('v-coas').innerHTML =
    `<div class="banner">${esc(d.scope)}</div>` +
    panel('Certificates','a correction creates a new certificate and marks the old one superseded',
      table([{label:'Token'},{label:'Sample'},{label:'Grade'},{label:'State'},{label:'Released'},{label:''}],
        d.rows, c=>`<td>${c.token?esc(c.token):blank('no token until released')}</td>
          <td>${esc(c.sample_id)}</td>
          <td>${pill(c.grade, c.grade==='PASS'?'good':c.grade==='FAIL'?'bad':'warn')}</td>
          <td>${pill(c.state, c.state==='released'?'good':c.state==='superseded'?'warn':'')}</td>
          <td>${c.released_at?fmt.stamp(c.released_at)+' · '+esc(c.released_by||''):'—'}</td>
          <td class="right">${c.state==='draft'
            ? `<button class="act primary" onclick="rel('${c.id}')">Release</button>`
            : c.state==='released'
              ? `<button class="act" onclick="sup('${c.id}')">Supersede</button>` : ''}</td>`, true)) +
    `<div id="cout"></div>`;
}
async function rel(id){
  const r = await API.post(`/api/coas/${id}/release`,{human:'lab.manager'});
  document.getElementById('cout').innerHTML = panel('Released','',
    `<div class="banner good">Token <b>${esc(r.token)}</b> · grade <b>${esc(r.grade)}</b>.
     <br>Hash <code style="font-size:11px">${esc(r.hash||'')}</code>
     <br>${esc(r.scope||'')}</div>`);
  coas();
}
async function sup(id){
  const r = await API.post(`/api/coas/${id}/supersede`,{human:'lab.manager',reason:'corrected result'});
  document.getElementById('cout').innerHTML = panel('Superseded','',
    `<div class="banner warn">${esc(r.note||r.error||'')} New token: <b>${esc(r.token||'—')}</b></div>`);
  coas();
}

async function verify(){
  document.getElementById('v-verify').innerHTML =
    panel('What a customer sees','this is the whole point of the build — a stranger can check a certificate',
      `<div style="display:flex;gap:8px;align-items:center">
        <input id="tok" placeholder="COA-12345678" style="font:inherit;font-size:16px;padding:8px;
          border:1px solid var(--line);border-radius:6px;flex:1">
        <button class="act primary" onclick="doVerify()">Check it</button></div>
       <div class="f" style="margin-top:8px">Try a real token from the Certificates tab, then try
       inventing one.</div>`) + `<div id="vout"></div>`;
}
async function doVerify(){
  const t = document.getElementById('tok').value.trim();
  if(!t) return;
  const r = await API.get(`/api/verify/${encodeURIComponent(t)}`);
  const cls = r.status==='genuine' ? (r.hash_intact?'good':'bad') : r.status==='superseded'?'warn':'bad';
  document.getElementById('vout').innerHTML = panel('Result','',
    `<div class="banner ${cls}"><b>${esc(r.status.toUpperCase())}</b> — ${esc(r.meaning)}</div>
     ${r.status==='unknown'?'':`<div class="grid">
       ${stat('Grade', esc(r.grade||'—'))}
       ${stat('Analyte', esc(r.analyte||'—'))}
       ${stat('Lot', esc(r.client_lot||'—'))}
       ${stat('Released', r.issued_at?fmt.stamp(r.issued_at):'—', esc(r.released_by||''))}
      </div>`}
     <div class="f" style="margin-top:10px">${esc(r.scope)}</div>`);
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi'+(Object.keys(roiIn).length?'?'+new URLSearchParams(roiIn):''));
  const rec = d.recorded||{};
  const f=[['samples_month','Samples per month','counted from the last 30 days'],
           ['price_per_sample','Price per sample','median of recorded prices'],
           ['turnaround_gain','Throughput gain (0–1)','your estimate, not ours'],
           ['coa_hours_wk','Certificate hours / week','yours'],
           ['status_hours_wk','Status-chasing hours / week','yours'],
           ['staff_rate','Staff hourly rate','yours'],
           ['verification_value','Value of verifiable certificates','you decide']];
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt,sp]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events'),API.get('/api/spec')]);
  document.getElementById('v-trust').innerHTML =
    panel('The question we refuse','a client asking what a number means for their product',
      `<button class="act" onclick="ask()">Ask "is 97% pure safe to use?"</button><div id="askout"></div>`) +
    renderApprovals(ap.pending,'decide') + renderEval(ev.grading) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function ask(){
  const r = await API.post('/api/ask',{text:'is 97% pure safe to use?'});
  document.getElementById('askout').innerHTML =
    `<div class="banner warn" style="margin-top:10px"><b>Refused, by class.</b> ${esc(r.reply)}
     <div class="f" style="margin-top:6px">${esc(r.why)}</div></div>`;
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'lab.manager'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
