<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-inbox"></section>
  <section class="view" id="v-trips"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on synthetic records — no real PHI. A condition
observation is passed verbatim, never assessed. A trip bills only with its complete log, a
dialysis trip is never bumped by software, and a driver assigns only with current credentials.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'inbox',label:'Inbox'},{id:'trips',label:'Trips & gates'},
      {id:'roi',label:'What it\'s worth'},{id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,inbox,trips,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${d.config.vehicles} vehicles · ${d.config.revenue}`;
  document.getElementById('v-board').innerHTML =
    panel('The runs, counted', '',
      `<div class="grid">
        ${stat('Unbillable completed trips', fmt.money(b.unbillable.value), `${b.unbillable.rows.length} trip(s) with incomplete logs`, b.unbillable.rows.length?'alert':'')}
        ${stat('Trips next 48h', fmt.num(b.tomorrow), `${b.protected_tomorrow} protected (dialysis/chemo) — never bumped`, '')}
        ${stat('Unhandled messages', fmt.num(b.messages_open), 'the condition read comes first', b.messages_open?'warn':'')}
        ${stat('', '', '')}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}
        ${stat('This week, counted', `${fmt.money(b.recovered.billed_value)}`,
               `${b.recovered.trips_billed} billed · ${b.recovered.trips_completed} completed · ${b.recovered.condition_escalations} escalation(s)`)}</div>`);
}

async function inbox(){
  const d = await API.get('/api/messages');
  document.getElementById('v-inbox').innerHTML =
    `<div class="banner warn">"Grandma seems confused today" goes to a human and the facility
      <b>verbatim</b> — software never assesses, never reassures, never says "probably fine".</div>` +
    panel('Messages', '', table([{label:'When'},{label:'From'},{label:'Message'},{label:'Label'},{label:''}],
      d.rows, m=>`<td>${fmt.stamp(m.at)}${m.demo_tag?' '+pill(m.demo_tag,'brand'):''}</td>
        <td>${esc(m.from||'')}</td><td>${esc(m.text)}</td>
        <td>${m.label?pill(m.label, m.label==='condition_change'?'bad':m.label==='complaint'?'warn':''):'—'}</td>
        <td class="right"><button class="act primary" onclick="handle('${m.id}')">Handle</button></td>`), true) +
    `<div id="mout"></div>`;
}
async function handle(id){
  const r = await API.post(`/api/messages/${id}/handle`);
  document.getElementById('mout').innerHTML = (r.steps||[]).map(s=>`
    <div class="panel"><h2>${esc(s.action)}</h2><div class="body">
      ${s.draft?`<div class="strong" style="white-space:pre-wrap">${esc(s.draft)}</div>`:''}
      ${s.refused?`<div class="banner warn">${esc(s.refused)}</div>`:''}
      <div class="why">${esc(s.why||'')}</div></div></div>`).join('');
}

async function trips(){
  const d = await API.get('/api/trips');
  document.getElementById('v-trips').innerHTML =
    `<div class="banner warn">Try it: bill the trip with the incomplete log — refused, fields
      named; bump the dialysis trip — refused; assign the driver with lapsed CPR — refused.</div>
     <div style="margin:10px 0">
      <button class="act" onclick="bill('tp_demo_nolog')">Bill: incomplete log</button>
      <button class="act primary" onclick="bill('tp_demo_logged')">Bill: log complete</button>
      <button class="act" onclick="bump('tp_demo_dialysis')">Bump the dialysis trip</button>
      <button class="act" onclick="assign('tp_demo_dialysis','dr_demo_lapsed')">Assign: lapsed CPR</button>
      <button class="act primary" onclick="assign('tp_demo_dialysis','dr_demo_clean')">Assign: credentials current</button>
     </div><div id="tout"></div>` +
    panel('Trips', '', table([{label:'Trip'},{label:'Patient'},{label:'Purpose'},{label:'Log'},{label:'State'}],
      d.rows, t=>`<td class="mono">${esc(t.id)}${t.demo_tag?' '+pill(t.demo_tag,'brand'):''}</td>
        <td class="mono">${esc(t.patient_ref||'')}</td>
        <td>${['dialysis','chemo','radiation'].includes((t.purpose||'').toLowerCase())?pill(t.purpose,'bad'):esc(t.purpose||'')}</td>
        <td>${t.trip_log&&t.trip_log.signature_ref?pill('complete','good'):t.trip_log?pill('incomplete','warn'):'—'}</td>
        <td>${t.billed_at?pill('billed','good'):t.completed_at?pill('done, unbilled','warn'):pill('scheduled')}</td>`), true);
}
async function bill(id){
  const r = await API.post(`/api/trips/${id}/bill`);
  document.getElementById('tout').innerHTML = r.refused
    ? panel('Refused', '', `<div class="banner warn">${esc(r.refused)}</div>`)
    : panel('Invoice drafted', '', `<div class="strong">queued at R1</div>`);
}
async function bump(id){
  const r = await API.post(`/api/trips/${id}/bump`);
  document.getElementById('tout').innerHTML = r.refused
    ? panel('Refused', '', `<div class="banner warn">${esc(r.refused)}</div>`)
    : panel('Bumpable', '', `<div class="strong">${esc(r.why)}</div>`);
}
async function assign(trip, driver){
  const r = await API.post(`/api/trips/${trip}/assign`,{driver_id:driver});
  document.getElementById('tout').innerHTML = r.refused
    ? panel('Refused', '', `<div class="banner warn">${esc(r.refused)}</div>`)
    : panel('Assignment', '', `<div class="strong">queued at R1</div>`);
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['unbillable_value','Unbillable completed trips','counted'],
    ['dispatch_hours_wk','Dispatch hrs/wk','your number'],['dispatch_rate','Dispatch rate','your number'],
    ['reliability_value','The never-bump record','yours or blank'],
    ['securement_value','The securement file','yours or blank']];
  const rec=d.recorded||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') + renderEval(ev.triage) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'owner'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
