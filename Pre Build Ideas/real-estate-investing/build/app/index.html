<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal OS</title><link rel="stylesheet" href="/_kit/kit.css">
</head>
<body>
<header class="top"><h1 id="co">…</h1><span class="sub" id="cosub"></span><span class="spacer"></span>
<button class="act" onclick="runAgents()">Run the sweeps</button></header>
<nav class="tabs"></nav>
<main>
  <section class="view on" id="v-board"></section>
  <section class="view" id="v-screen"></section>
  <section class="view" id="v-deal"></section>
  <section class="view" id="v-inbox"></section>
  <section class="view" id="v-roi"></section>
  <section class="view" id="v-trust"></section>
</main>
<footer class="foot">Demonstration build on a SYNTHETIC market. Every figure is a model on stated,
adjustable assumptions — bands, never points, past the near horizon; no estimate below the comp
floor; no verdicts, ever. Not investment advice. Nothing is sent.</footer>
<script src="/_kit/kit.js"></script>
<script>
tabs([{id:'board',label:'Board'},{id:'screen',label:'Deal screen'},{id:'deal',label:'One deal, honestly'},
      {id:'inbox',label:'Inbox'},{id:'roi',label:'What it\'s worth'},{id:'trust',label:'Trust & audit'}], load);
async function load(w){ w=w||'board'; ({board,screen,deal,inbox,roi,trust})[w](); }

async function board(){
  const d = await API.get('/api/board'), b = d.board;
  document.getElementById('co').textContent = d.config.company;
  document.getElementById('cosub').textContent = `${d.config.doors} doors · ${d.config.data_note.split('—')[0]}`;
  const s = b.screen;
  document.getElementById('v-board').innerHTML =
    panel('The screen, counted', '',
      `<div class="grid">
        ${s.refused ? stat('Screen', '—', esc(s.refused), 'warn')
          : stat('Deals clearing YOUR bar', fmt.num(s.matches),
              `DSCR ≥ ${s.criteria.min_dscr} · CoC ≥ ${(s.criteria.min_coc*100).toFixed(0)}% · ≤ $${s.criteria.max_price.toLocaleString()}`)}
        ${stat('Underwrites this week', fmt.num(b.screened.underwrites), `${b.screened.cleared_bar} cleared the bar`)}
        ${stat('Unhandled messages', fmt.num(b.messages_open), 'the advice ask reads first', b.messages_open?'warn':'')}
        ${stat('Waiting on you', fmt.num(d.pending_approvals), 'the R1 floor')}
       </div>
       <div class="grid" style="margin-top:14px">${renderAutomation(b.automation)}
        ${s.refused?'':stat('Skipped honestly', `${s.skipped.below_bar}`, `below your bar · ${s.skipped.over_price} over price cap`)}
       </div>`);
}

async function screen(){
  const d = await API.get('/api/screen');
  document.getElementById('v-screen').innerHTML = d.refused
    ? `<div class="banner warn">${esc(d.refused)}</div>`
    : `<div class="banner">Ranked by <b>the investor's recorded bar</b> — min DSCR ${d.criteria.min_dscr},
        min CoC ${(d.criteria.min_coc*100).toFixed(0)}%, max $${d.criteria.max_price.toLocaleString()}.
        Every row carries its why-trace. ${esc(d.not_advice)}</div>` +
      panel(`${d.rows.length} of ${d.considered} considered`, esc(d.note), table(
        [{label:'Address'},{label:'Price',num:true},{label:'As'},{label:'$/mo',num:true},
         {label:'DSCR',num:true},{label:'CoC',num:true},{label:'Why it ranks'}],
        d.rows, r=>`<td>${esc(r.listing.address)}</td><td class="num">$${r.listing.price.toLocaleString()}</td>
          <td>${pill(r.strategy.toUpperCase(),'brand')}</td><td class="num">${fmt.money(r.cashflow_monthly)}</td>
          <td class="num">${r.dscr}</td><td class="num">${(r.cash_on_cash*100).toFixed(1)}%</td>
          <td class="why">${esc(r.why)}</td>`), true);
}

async function deal(){
  document.getElementById('v-deal').innerHTML =
    `<div class="banner">One property, three strategies, same stated assumptions — then the bands,
      the payoff, and the stress grid. Try the refusals too.</div>
     <div style="margin:10px 0">
      <button class="act primary" onclick="an('ls_demo_birch')">Underwrite 412 Birchwood (Harbor Point)</button>
      <button class="act" onclick="an('ls_demo_fern')">Underwrite the Fernwood duplex (Maplewood — no STR comps)</button>
      <button class="act" onclick="pointRefusal()">Ask for a 10-year point estimate</button>
      <button class="act" onclick="payoff()">Payoff with $300/mo extra</button>
     </div><div id="dout"></div>`;
}
async function an(id){
  const r = await API.post(`/api/listings/${id}/analyze`, {});
  const s = r.summary;
  document.getElementById('dout').innerHTML =
    panel(esc(r.listing.address), 'three strategies, side by side',
      `<div class="grid">` + Object.entries(s).map(([k,v]) => v.refused
        ? stat(k.toUpperCase(), 'UNMEASURED', esc(v.refused), 'warn')
        : stat(k.toUpperCase(), fmt.money(v.cashflow_monthly)+'/mo',
            `DSCR ${v.dscr} · CoC ${(v.cash_on_cash*100).toFixed(1)}% · cap ${(v.cap_rate*100).toFixed(2)}%${v.stale_flag?' · ⚠ stale rate':''}`)
      ).join('') + `</div>
      <div class="why" style="margin-top:10px">${esc((Object.values(s).find(x=>!x.refused)||{}).label||'')}
        — assumptions: ${esc(((Object.values(s).find(x=>!x.refused)||{}).inputs||{}).assumptions_source||'')}</div>`) +
    await bands(r.listing.id) + await sens(r.listing.id);
}
async function bands(id){
  const b = await API.get(`/api/listings/${id}/bands?strategy=ltr&years=10`);
  if (b.refused) return panel('10-year bands', '', `<div class="banner warn">${esc(b.refused)}</div>`);
  return panel('10-year exit — three bands, never one number', esc(b.appreciation_basis),
    `<div class="grid">` + Object.entries(b.bands).map(([k,v]) =>
      stat(k.toUpperCase(), v.irr!=null?(v.irr*100).toFixed(1)+'% IRR':'—',
        `growth ${(v.growth*100).toFixed(1)}%/yr · exit ${fmt.money(v.exit_value)} · net ${fmt.money(v.net_proceeds)}`)).join('')
    + `</div><div class="why" style="margin-top:8px">${esc(b.label)}</div>`);
}
async function sens(id){
  const g = await API.get(`/api/listings/${id}/sensitivity?strategy=ltr`);
  if (g.refused) return '';
  return panel('The stress grid', esc(g.note),
    `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>rate Δ</th><th>rent −10%</th><th>rent as-modeled</th><th>rent +10%</th></tr></thead>
     <tbody>${g.grid.map(row=>`<tr><td>${(row[0].rate_delta*100).toFixed(0)>0?'+':''}${(row[0].rate_delta*100).toFixed(0)}%</td>
       ${row.map(c=>`<td class="num ${c.dscr<1?'':''}">${c.dscr<1?'⚠ ':''}DSCR ${c.dscr} · ${(c.coc*100).toFixed(1)}%</td>`).join('')}</tr>`).join('')}
     </tbody></table></div>`);
}
async function pointRefusal(){
  const r = await API.get('/api/listings/ls_demo_birch/point?strategy=ltr&years=10');
  document.getElementById('dout').innerHTML = r.refused
    ? panel('Refused', '', `<div class="banner warn">${esc(r.refused)}</div>`)
    : panel('Point (near horizon)', '', `<pre>${esc(JSON.stringify(r.bands||r,null,1)).slice(0,400)}</pre>`);
}
async function payoff(){
  const r = await API.post('/api/listings/ls_demo_birch/payoff', {strategy:'ltr', extra_monthly:300});
  if (r.refused) { document.getElementById('dout').innerHTML = `<div class="banner warn">${esc(r.refused)}</div>`; return; }
  const p = r.payoff;
  document.getElementById('dout').innerHTML =
    panel('Payoff — with $300/mo extra principal', esc(r.label),
      `<div class="grid">
        ${stat('Paid off in', p.years+' yrs', `month ${p.month} of 360`)}
        ${stat('Total interest', fmt.money(p.total_interest))}
        ${stat('Payment', fmt.money(r.payment_monthly)+'/mo', 'incl. the extra $300')}
       </div>
       <div class="why" style="margin-top:8px">Balance by year: ${p.yearly_balances.slice(0,8).map(y=>`y${y.year} ${fmt.money(y.balance)}`).join(' · ')} …</div>`);
}

async function inbox(){
  const d = await API.get('/api/messages');
  document.getElementById('v-inbox').innerHTML =
    `<div class="banner warn">"Should I buy it?" gets <b>arithmetic, bands, and the not-advice
      line</b> — never a verdict. A yes from a tool is someone else's judgment wearing math.</div>` +
    panel('Messages', '', table([{label:'When'},{label:'From'},{label:'Message'},{label:'Label'},{label:''}],
      d.rows, m=>`<td>${fmt.stamp(m.at)}${m.demo_tag?' '+pill(m.demo_tag,'brand'):''}</td>
        <td>${esc(m.from||'')}</td><td>${esc(m.text)}</td>
        <td>${m.label?pill(m.label, m.label==='advice_ask'?'bad':''):'—'}</td>
        <td class="right"><button class="act primary" onclick="handle('${m.id}')">Handle</button></td>`), true) +
    `<div id="mout"></div>`;
}
async function handle(id){
  const r = await API.post(`/api/messages/${id}/handle`);
  document.getElementById('mout').innerHTML = (r.steps||[]).map(s=>`
    <div class="panel"><h2>${esc(s.action)}</h2><div class="body">
      ${s.draft?`<div class="strong" style="white-space:pre-wrap">${esc(s.draft)}</div>`:''}
      ${s.refused?`<div class="banner warn">${esc(s.refused)}</div>`:''}
      <div class="why">${esc(s.why||'')}</div></div></div>`).join('');
}

let roiIn={};
async function roi(){
  const d = await API.get('/api/roi?'+new URLSearchParams(roiIn));
  const f=[['deals_month','Deals screened / mo','counted'],['min_per_underwrite','Min per manual underwrite','your number'],
    ['rate','Your hourly value','your number'],['offers_yr','Offers / yr','your number'],
    ['close_rate','Close rate','your number (0–1)'],['per_deal_value','Per-deal economics','your number'],
    ['bad_buy_value','The bad buy avoided','yours or blank']];
  const rec=d.recorded||{};
  document.getElementById('v-roi').innerHTML =
    panel('Your numbers','recorded values come from this system',
      `<div class="grid">${f.map(([k,l,n])=>`<div class="stat"><div class="k">${esc(l)}</div>
        <input id="in_${k}" value="${rec[k] ?? roiIn[k] ?? ''}" placeholder="not set"
         style="font:inherit;font-size:18px;font-weight:600;width:100%;border:0;border-bottom:1px solid var(--line);padding:4px 0;background:none">
        <div class="f">${k in rec?'<span class="pill good">recorded</span> ':''}${esc(n)}</div></div>`).join('')}</div>
      <div style="margin-top:12px"><button class="act primary" onclick="applyRoi()">Recompute</button></div>`) +
    renderRoi(d);
  window.__f=f.map(x=>x[0]);
}
function applyRoi(){roiIn={};(window.__f||[]).forEach(k=>{const v=document.getElementById('in_'+k).value.trim(); if(v!=='')roiIn[k]=v;});roi();}

async function trust(){
  const [ap,ev,au,evt]=await Promise.all([API.get('/api/approvals'),API.get('/api/eval'),
    API.get('/api/autonomy'),API.get('/api/events')]);
  document.getElementById('v-trust').innerHTML =
    renderApprovals(ap.pending,'decide') + renderEval(ev.triage) +
    renderAutonomy(au.matrix) + renderEvents(evt.events,60);
}
async function decide(id,ok){ await API.post(`/api/approvals/${id}/decide`,{approve:ok,human:'operator'}); trust(); }
async function runAgents(){ await API.post('/api/agents/run'); load(document.querySelector('nav.tabs button.on').dataset.v); }
load('board');
</script>
</body>
</html>
