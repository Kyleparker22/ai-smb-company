<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pre-storm staging — Sample Product · yourco</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--indigo:#161B33;--cream:#F4EFE6;--parchment:#EAE1CD;--brass:#B8965A;--ink:#161B33;--muted:#6b6f83;--line:rgba(22,27,51,.12)}
  *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,-apple-system,Helvetica,Arial,sans-serif;line-height:1.5}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;line-height:1.15}
  .eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:600}
  .topbar{background:var(--indigo);color:var(--cream);padding:14px 0}.topbar .wrap{display:flex;justify-content:space-between;align-items:center}
  .mark{font-family:Fraunces,serif;font-weight:700;font-size:20px}.mark .dot{color:var(--brass)} .topbar .tag{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#b9bdd0}
  .hero{background:var(--indigo);color:var(--cream);padding:28px 0} .hero h1{color:#fff;font-size:clamp(24px,4vw,36px);margin:8px 0 6px} .hero p{color:#c7cbe0;max-width:60ch}
  a.back{color:var(--brass);text-decoration:none;font-size:13px;font-weight:600}
  section{padding:28px 0}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px} @media(max-width:720px){.cols{grid-template-columns:1fr}}
  .col{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .col h3{font-size:18px} .col .when{font-size:12px;color:var(--muted);margin-bottom:10px}
  .stage{background:var(--indigo);color:#fff;border-radius:10px;padding:11px 13px;margin:8px 0;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  .stage .lvl{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--brass);color:#20160a}
  .watch{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)} .watch:last-child{border-bottom:none}
  .rl{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .quiet{font-size:14px;color:#3a3f55;background:var(--parchment);border-radius:10px;padding:12px 14px;margin-top:6px}
  .note{font-size:13px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
  <div class="topbar"><div class="wrap"><div class="mark">yourco<span class="dot">.</span></div><div class="tag">Sample Product · staging</div></div></div>
  <div class="hero"><div class="wrap"><a class="back" href="index.html">← control tower</a>
    <div class="eyebrow" style="margin-top:10px">pre-storm staging</div>
    <h1>Position crews the night before.</h1>
    <p>Live NOAA forecast outlooks (today + tomorrow). When there's real storm risk, stage a crew nearby so they canvass the moment it clears — before anyone else knows it hit.</p></div></div>

  <section><div class="wrap">
    <div class="cols" id="cols"></div>
    <div class="note" id="note"></div>
  </div></section>

<script src="staging_data.js"></script>
<script>
  const RL={1:['#9aa0b5','General storms'],2:['#c7a24a','Marginal'],3:['#d98b3a','Slight'],4:['#d0703a','Enhanced'],5:['#b23a3a','Moderate'],6:['#8a2b2b','High']};
  function draw(){ const S=window.STAGING; if(!S){return setTimeout(draw,60);}
    const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const col=(title,when,rows,minr)=>{
      const stage=rows.filter(r=>r.level>=minr), watch=rows.filter(r=>r.level<minr);
      let h=`<div class="col"><h3>${title}</h3><div class="when">${when}</div>`;
      if(stage.length){ h+=stage.map(r=>`<div class="stage"><span>▸ Stage <b>${esc(r.name)}</b> <span style="color:#c7cbe0">(${esc(r.county)} Co)</span></span><span class="lvl">${esc(r.label)}</span></div>`).join(''); }
      else { h+=`<div class="quiet">No staging-level risk. ${watch.length?'Marginal storms possible — watch, not a pre-roll.':'Clear.'}</div>`; }
      if(watch.length){ h+=`<div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 6px">Watch (${watch.length})</div>`+
        watch.slice(0,8).map(r=>`<div class="watch"><span>${esc(r.name)} <span style="color:var(--muted)">· ${esc(r.county)} Co</span></span><span class="rl" style="background:${RL[r.level][0]}22;color:${RL[r.level][0]}">${esc(r.label)}</span></div>`).join('');
        if(watch.length>8) h+=`<div class="watch" style="color:var(--muted)">+ ${watch.length-8} more</div>`;
      }
      return h+'</div>';
    };
    document.getElementById('cols').innerHTML = col('Today', 'day-1 outlook', S.day1, S.min_risk) + col('Tomorrow', 'day-2 outlook — pre-position tonight', S.day2, S.min_risk);
    document.getElementById('note').textContent = `Live NOAA SPC convective outlook · updated ${S.generated}. Staging fires at Slight+ risk; marginal/general risk is a watch. Quiet is normal — most days don't warrant pre-positioning.`;
  } draw();
</script>
</body>
</html>
