<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claim packet — Sample Product · yourco</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--indigo:#161B33;--cream:#F4EFE6;--parchment:#EAE1CD;--brass:#B8965A;--ink:#161B33;--muted:#6b6f83;--high:#3f7d5a;--line:rgba(22,27,51,.12)}
  *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,-apple-system,Helvetica,Arial,sans-serif;line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:0 24px}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;line-height:1.15}
  .eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:600}
  .topbar{background:var(--indigo);color:var(--cream);padding:14px 0}.topbar .wrap{display:flex;justify-content:space-between;align-items:center;max-width:820px}
  .mark{font-family:Fraunces,serif;font-weight:700;font-size:20px}.mark .dot{color:var(--brass)} .topbar .tag{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#b9bdd0}
  .hero{background:var(--indigo);color:var(--cream);padding:26px 0} .hero h1{color:#fff;font-size:clamp(22px,3.6vw,32px);margin:8px 0 4px}
  a.back{color:var(--brass);text-decoration:none;font-size:13px;font-weight:600}
  section{padding:28px 0}
  .doc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 28px;box-shadow:0 14px 40px -22px rgba(22,27,51,.4)}
  .doc h2{font-size:20px;border-bottom:2px solid var(--indigo);padding-bottom:8px;margin-bottom:14px}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;font-size:14px;margin-bottom:8px}
  .meta div b{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;display:block}
  .hd3{font-family:Inter;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:20px 0 8px}
  .ev{font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)} .ev:last-child{border-bottom:none}
  .ev .t{color:var(--muted)} .ev .m{font-weight:700;color:var(--high)} .ev .r{color:#3a3f55}
  .badge{font-size:10px;font-weight:700;border-radius:4px;padding:2px 6px;margin-left:6px}
  .badge.M{background:rgba(63,125,90,.14);color:var(--high)} .badge.E{background:rgba(169,128,51,.16);color:#a98033}
  .src{margin-top:18px;font-size:13px;color:#3a3f55;background:var(--parchment);border-radius:10px;padding:13px 15px}
  .foot{font-size:11.5px;color:var(--muted);margin-top:14px}
  .print{margin-top:16px;background:var(--brass);color:#20160a;border:none;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;font-family:inherit}
  @media print{.topbar,.hero,.print,a.back{display:none} body{background:#fff} .doc{box-shadow:none;border:none}}
</style>
</head>
<body>
  <div class="topbar"><div class="wrap"><div class="mark">yourco<span class="dot">.</span></div><div class="tag">Sample Product · claim packet</div></div></div>
  <div class="hero"><div class="wrap"><a class="back" href="index.html">← control tower</a>
    <div class="eyebrow" style="margin-top:10px">claim-assist</div>
    <h1>Storm verification — ready for the adjuster.</h1></div></div>

  <section><div class="wrap">
    <div class="doc" id="doc"></div>
    <button class="print" onclick="window.print()">Print / save PDF</button>
    <div class="foot">Auto-generated from the retained NOAA evidence trail. Documentation only — not an adjustment or coverage determination.</div>
  </div></section>

<script src="claim_data.js"></script>
<script>
  function draw(){ const C=window.CLAIM; if(!C){return setTimeout(draw,60);}
    const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const ev=e=>`<div class="ev"><span class="t">${esc(e.time)}Z</span> — <span class="m">${esc(e.hazard)} ${e.value!=null?esc(e.value):''}</span>
      <span class="badge ${e.qualifier==='M'?'M':'E'}">${e.qualifier==='M'?'MEASURED':'estimated'}</span>
      <span class="r"> · ${esc(e.reporter)}${e.remark?' — '+esc(e.remark):''}</span></div>`;
    document.getElementById('doc').innerHTML = `
      <h2>Storm verification — insurance claim support</h2>
      <div class="meta">
        <div><b>Property</b>${esc(C.address)||'[address]'}</div>
        <div><b>Location</b>${esc(C.county)} County, FL</div>
        <div><b>Date of loss</b>${esc(C.date)}</div>
        <div><b>Verified peak</b>${esc(C.peak)}</div>
        <div style="grid-column:1/-1"><b>Confidence</b>${esc(C.confidence)} — cross-verified across ${esc((C.sources||[]).join(', '))}</div>
      </div>
      <div class="hd3">Official measured data (source of record)</div>
      ${C.measured.length?C.measured.map(ev).join(''):'<div class="ev">No instrument-measured value in NOAA reports; see corroborating reports below.</div>'}
      ${C.other.length?`<div class="hd3">Corroborating reports</div>${C.other.map(ev).join('')}`:''}
      <div class="src"><b>Source:</b> NOAA National Weather Service Local Storm Reports — the storm-verification standard used by property insurers. Corroborated by NOAA SPC and active NWS alerts where noted. Evidence trail retained and auditable. <br><span style="color:var(--muted)">Prepared by yourco storm-command · verification date ${esc(C.generated)}.</span></div>`;
  } draw();
</script>
</body>
</html>
